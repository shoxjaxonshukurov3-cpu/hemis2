 $("t0").innerHTML='<div class="top"><div><h1>Salom, '+cap(U.name.split(" ")[1]||U.name)+'</h1><span class="mut">ST-50/24 · 5-semestr</span></div><div class="ava">'+ini()+'</div></div>'+
 '<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="mut">Hemis CARD balansi</div><b style="font-size:24px" id="hb0">'+fmt(M.hc)+'</b></div><button class="btn s" style="width:auto" onclick="go(3)">Hamyon</button></div>'+
 '<div class="tiles"><button class="tile" onclick="go(4)"><b>ID</b><span>Shaxsiy QR</span></button><button class="tile" onclick="go(2)"><b>FACE</b><span>Davomat</span></button><button class="tile" onclick="go(3)"><b>CARD</b><span>Hamyon</span></button><button class="tile" onclick="go(3);document.getElementById(\'at\').scrollIntoView()"><b>ATTO</b><span>Transport</span></button></div>'+
 '<h2>Bugungi darslar</h2><div class="card" id="td">'+today()+'</div>'+
 '<h2>O\'zlashtirish</h2><div class="chips"><div class="card chip"><b>'+U.gpa+'</b><span class="mut">GPA / 5</span></div><div class="card chip"><b>60</b><span class="mut">Kredit</span></div><div class="card chip"><b>0/12</b><span class="mut">Qarz</span></div></div>';
 $("t1").innerHTML='<h1>Dars jadvali</h1><span class="mut">12-17 oktyabr haftasi</span>'+sched();
 $("t2").innerHTML='<h1>Hemis FACE</h1><span class="mut">Yuz orqali davomat</span><div class="card" style="margin-top:14px"><p class="mut">Darsda kameraga qarang, davomat avtomatik qayd etiladi.</p><button class="btn" id="ab" style="margin-top:12px" onclick="att()">Yuzni skanerlash</button></div><h2>Bugun</h2><div class="card" id="td2">'+today()+'</div><h2>Shu oy</h2><div class="chips"><div class="card chip"><b>94%</b><span class="mut">Davomat</span></div><div class="card chip"><b>41</b><span class="mut">Qatnashgan</span></div><div class="card chip"><b>3</b><span class="mut">Qoldirgan</span></div></div>';
 $("t3").innerHTML='<h1>Hamyon</h1><div class="pay" style="margin-top:14px"><div class="tp"><span>HEMIS CARD</span><span>UZCARD</span></div><div><span style="opacity:.7;font-size:13px">Balans</span><div class="bal" id="hb"></div></div><div style="letter-spacing:.14em;opacity:.9">8600 •••• •••• '+U.id.slice(-4)+'</div></div><div class="acts"><button class="btn s" onclick="toast(\'To\\\'ldirish: Payme / Click orqali\')">To\'ldirish</button><button class="btn s" id="bk" onclick="blk()">Kartani bloklash</button></div><div id="at"><h2>Hemis × ATTO</h2><div class="pay g" style="min-height:130px"><div class="tp"><span>ATTO</span><span>Talaba tarifi</span></div><div><span style="opacity:.7;font-size:13px">Yo\'l haqi balansi</span><div class="bal" id="ab2"></div></div></div><div class="amts" id="am"></div><button class="btn" onclick="top_()">Hemis CARD\'dan ATTO\'ga o\'tkazish</button></div><h2>Oxirgi amallar</h2><div class="card" id="hx"></div>';
 $("am").innerHTML=[10000,20000,50000,100000].map(function(a){return'<button data-a="'+a+'" class="'+(a==sel?"on":"")+'" onclick="sel='+a+';[].forEach.call(document.querySelectorAll(\'#am button\'),function(b){b.classList.toggle(\'on\',b.dataset.a==sel)})">'+a/1000+" ming</button>"}).join("");
 $("t4").innerHTML='<h1>Hemis ID</h1><div class="idc" style="margin-top:14px"><div style="font-size:12px;opacity:.7">Toshkent davlat iqtisodiyot universiteti</div><div class="nm">'+U.name+'</div><div class="no">ID '+U.id+'</div><div class="idr"><div class="qr" id="qr"></div><div style="font-size:12px;display:grid;gap:8px"><div><span style="opacity:.6;display:block">Guruh</span>ST-50/24</div><div><span style="opacity:.6;display:block">Semestr</span>5-semestr</div></div></div></div><div class="card" style="margin-top:12px"><span class="mut">QR kod yangilanishiga <b id="cd">30</b> soniya</span><div class="bar"><i id="cdb" style="width:100%"></i></div></div>';
 money()}
function money(){$("hb").textContent=fmt(M.hc);$("ab2").textContent=fmt(M.at);$("hb0").textContent=fmt(M.hc);$("hx").innerHTML=H.map(function(t){return'<div class="row"><div class="g"><b>'+t[0]+'</b></div><b style="color:'+(t[1][0]=="+"?"var(--ok)":"inherit")+'">'+t[1]+" so'm</b></div>"}).join("")}
function top_(){if(M.blk)return toast("Hemis CARD bloklangan");if(M.hc<sel)return toast("Mablag' yetarli emas");M.hc-=sel;M.at+=sel;H.unshift(["ATTO'ga o'tkazma","-"+fmt(sel).replace(" so'm","")]);money();toast(fmt(sel)+" ATTO'ga o'tkazildi")}
function blk(){M.blk=!M.blk;$("bk").textContent=M.blk?"Blokdan chiqarish":"Kartani bloklash";toast(M.blk?"Karta bloklandi":"Karta faol")}
function att(){if(attended)return toast("Davomat allaqachon qayd etilgan");face(function(){attended=true;show("app");go(2);$("ab").textContent="Davomat qayd etildi";$("td").innerHTML=$("td2").innerHTML=today();toast("Davomat qayd etildi")},"Davomat uchun yuz skaneri","app")}
function qr(){var s=Math.floor(Math.random()*1e9),r=function(){return(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff},h="";
 for(var y=0;y<21;y++)for(var x=0;x<21;x++){var f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13),on;
  if(f){var ax=x>13?x-14:x,ay=y>13?y-14:y;on=ax==0||ax==6||ay==0||ay==6||(ax>1&&ax<5&&ay>1&&ay<5)}else on=r()>.5;
  if(on)h+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'}
 $("qr").innerHTML='<svg viewBox="0 0 21 21" fill="#1B365D" shape-rendering="crispEdges">'+h+"</svg>"}
function qrOn(){qr();cd=30;clearInterval(qt);qt=setInterval(function(){cd--;if(cd<=0){cd=30;qr()}$("cd").textContent=cd;$("cdb").style.width=cd/30*100+"%"},1000)}
function enter(){render();show("app");go(0)}
</script></body></html>
