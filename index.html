<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HEMIS 3.0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --paper:#FCFAF6; --ink:#1B2A49; --muted:#6B7280; --line:#E1DED6; --pencil:#F5C518; --accent:#B3261E; color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper:#17181B; --ink:#F1F1EC; --muted:#A3A8B0; --line:#34373D; --accent:#FF8A80; color-scheme:dark; }
  }
  :root[data-theme="dark"] { --paper:#17181B; --ink:#F1F1EC; --muted:#A3A8B0; --line:#34373D; --accent:#FF8A80; color-scheme:dark; }
  * { box-sizing:border-box; }
  html { min-height:100%; }
  body {
    margin:0; min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;
    background:var(--paper); color:var(--ink);
    font-family:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; line-height:1.5;
    padding:calc(2rem + env(safe-area-inset-top, 0px)) calc(1.25rem + env(safe-area-inset-right, 0px)) calc(2rem + env(safe-area-inset-bottom, 0px)) calc(1.25rem + env(safe-area-inset-left, 0px));
    text-align:center;
  }
  main { width:100%; max-width:760px; }
  h1 { margin:0; font-weight:800; letter-spacing:-0.035em; line-height:1; font-size:clamp(3.5rem, 15vw, 8rem); }
  .sub { color:var(--muted); font-size:clamp(1.125rem, 3vw, 1.5rem); margin:0.75rem 0 0; }
  .roles { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:1rem; margin:3rem 0 0; }
  .btn {
    display:block; padding:1.25rem 1rem; border-radius:14px; text-decoration:none;
    background:var(--ink); color:var(--paper); font-weight:600; font-size:1.25rem;
    border-bottom:5px solid var(--pencil); transition:transform .15s ease, background .15s ease, color .15s ease;
  }
  .btn:hover { background:var(--pencil); color:#23262B; transform:translateY(-2px); }
  .btn:focus-visible, .back:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
  .back { display:inline-block; margin:2.5rem 0 0; color:var(--ink); font-weight:600; text-decoration:none; border-bottom:2px solid var(--pencil); padding-bottom:1px; }
  .note { color:var(--muted); margin:1.25rem 0 0; }
  footer { margin-top:3rem; font-size:.875rem; }
  footer a { color:var(--muted); text-decoration:none; }
  footer a:hover { color:var(--ink); }
  @media (prefers-reduced-motion: reduce) { .btn { transition:none; } .btn:hover { transform:none; } }
</style>
</head>
<body>
<main>
  <h1>HEMIS 3.0</h1>
  <p class="sub">Xush kelibsiz</p>
  <nav class="roles" aria-label="Rolni tanlang">
    <a class="btn" href="/administrator/">Administrator</a>
    <a class="btn" href="/oqituvchi/">O'qituvchi</a>
    <a class="btn" href="/talaba/">Talaba</a>
  </nav>
  <footer><a href="https://qalamtarosh.uz">&larr; qalamtarosh.uz</a></footer>
</main>
</body>
</html>
