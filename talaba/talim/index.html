<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ta'lim | HEMIS 3.0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("hemis_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#F2F5FA;--sf:#fff;--ink:#1B365D;--mut:#667791;--ln:#DDE4EE;--p:#1B365D;--on:#fff;--b2:#5B8FD0;--ok:#22A06B;--wn:#F59E0B;--er:#E5484D;--bl:#3B82F6;--vi:#7C5CD6;--dot:rgba(27,54,93,.13);--blob1:rgba(91,143,208,.34);--blob2:rgba(124,92,214,.16);--sh:0 1px 2px rgba(27,54,93,.05),0 12px 30px rgba(27,54,93,.07);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1220;--sf:#131C2E;--ink:#EAF0FA;--mut:#8DA0BD;--ln:#243350;--p:#5B8FD0;--on:#07101F;--dot:rgba(141,160,189,.16);--blob1:rgba(59,130,246,.22);--blob2:rgba(124,92,214,.22);--sh:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0B1220;--sf:#131C2E;--ink:#EAF0FA;--mut:#8DA0BD;--ln:#243350;--p:#5B8FD0;--on:#07101F;--dot:rgba(141,160,189,.16);--blob1:rgba(59,130,246,.22);--blob2:rgba(124,92,214,.22);--sh:none;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 Manrope,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
a,button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--b2);outline-offset:2px}
.mut{color:var(--mut);font-size:13px}
h1{font-size:25px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
h2{font-size:17px;font-weight:800;letter-spacing:-.01em}

/* ===== kod bilan chizilgan fon ===== */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg:before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.5px);background-size:24px 24px;-webkit-mask-image:linear-gradient(#000 0,transparent 62%);mask-image:linear-gradient(#000 0,transparent 62%)}
.bg i{position:absolute;border-radius:50%;filter:blur(64px)}
.bg .b1{width:360px;height:360px;right:-120px;top:-110px;background:var(--blob1);animation:drift 22s ease-in-out infinite alternate}
.bg .b2{width:300px;height:300px;left:-130px;top:46%;background:var(--blob2);animation:drift 28s ease-in-out infinite alternate-reverse}
.bg svg{position:absolute;right:-150px;top:-150px;width:420px;height:420px;color:var(--b2);opacity:.35;animation:spin 140s linear infinite}
@keyframes drift{to{transform:translate(-40px,50px) scale(1.12)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== sahifa ===== */
main{max-width:720px;margin:0 auto;padding:18px 16px 118px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.ava{width:52px;height:52px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--b2),var(--vi),var(--ok));flex:none}
.ava span{width:100%;height:100%;border-radius:50%;background:var(--sf);display:grid;place-items:center;font-weight:800;color:var(--ink);font-size:16px}
.chips{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.chips span{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:color-mix(in srgb,var(--b2) 16%,transparent);color:var(--ink)}
.tr{display:flex;gap:8px;align-items:center}
.ib,.xb{min-height:48px;border:1px solid var(--ln);background:var(--sf);border-radius:14px;cursor:pointer;font-weight:700;transition:transform .15s}
.ib{width:48px;display:grid;place-items:center}.xb{padding:0 16px}
.ib:active,.xb:active{transform:scale(.96)}
.ib svg{width:22px;height:22px}

/* ===== bugungi darslar ===== */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 10px}
.sec .mut{font-weight:700}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:8px 16px;box-shadow:var(--sh)}
.ls{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln);position:relative}
.ls:last-child{border:0}
.ls:before{content:"";width:4px;align-self:stretch;border-radius:4px;background:var(--bl);flex:none}
.ls.ok:before{background:var(--ok)}.ls.no:before{background:var(--er)}
.ls .tm{width:48px;flex:none;line-height:1.25}.ls .tm b{display:block;font-size:14px}.ls .tm span{font-size:12px;color:var(--mut);font-weight:700}
.ls .g{flex:1;min-width:0}.ls .g b{display:block;font-size:15px;line-height:1.3}
.pgb{height:5px;border-radius:5px;background:var(--ln);margin-top:8px;overflow:hidden}
.pgb i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--bl),var(--b2));transition:width 1s linear}
.tag{font-size:12px;font-weight:800;padding:5px 11px;border-radius:20px;white-space:nowrap;flex:none}
.tag.ok{background:rgba(34,160,107,.16);color:var(--ok)}.tag.no{background:rgba(229,72,77,.14);color:var(--er)}
.tag.bl{background:rgba(59,130,246,.16);color:var(--bl)}
.tag .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bl);margin-right:6px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.7);opacity:.35}}
.empty{display:flex;align-items:center;gap:14px;padding:16px 0}
.empty svg{width:56px;height:56px;flex:none}
.note{margin:16px 4px 0;font-size:12.5px;color:var(--mut)}

/* ===== pastki navigatsiya ===== */
.nv{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--sf) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0))}
.nv a{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;text-decoration:none;color:var(--mut);font-weight:700;font-size:11px;transition:background .2s,color .2s}
.nv a svg{width:23px;height:23px}
.nv a[aria-current]{color:var(--p);background:color-mix(in srgb,var(--p) 14%,transparent)}
.nv a[aria-current] svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6)}}
@media(min-width:700px){.nv{left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:720px;border:1px solid var(--ln);border-bottom:0;border-radius:20px 20px 0 0}}

/* ===== sahifa ochilishi: bitta tartibli ketma-ketlik ===== */
.rise{opacity:0;transform:translateY(16px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*90ms)}
@keyframes rise{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important}
 .rise{opacity:1;transform:none}
}

/* ===== Ta'lim sahifasi ===== */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px;color:#fff;background:linear-gradient(135deg,#1B365D 0%,#4B3A9A 62%,#7C5CD6 135%);box-shadow:0 18px 40px rgba(75,58,154,.28);--mx:70%;--my:0%}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.2),transparent 52%),repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 1px,transparent 1px 16px)}
.hero>*{position:relative}
.hero .art{position:absolute;right:-6px;bottom:-10px;width:156px;height:109px;opacity:.5;pointer-events:none}
.hr1{display:flex;gap:14px;align-items:center;justify-content:space-between}
.hr1 .hl{min-width:0;flex:1}
.hero small{display:block;font-size:13px;font-weight:700;opacity:.82}
.hero .nx{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-top:6px}
.hero .cd{display:block;font-size:13px;font-weight:600;opacity:.88;margin-top:6px}
.rg{position:relative;width:96px;height:96px;flex:none}
.rg svg{width:100%;height:100%;transform:rotate(-90deg)}
.rg .tk{stroke:rgba(255,255,255,.2)}
.rg .pr{stroke:#7FE0B5;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1)}
.rg .rn{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.rg .rn b{font-size:23px;font-weight:800}.rg .rn span{font-size:11px;font-weight:700;opacity:.8}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.pills span{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 12px;border-radius:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);font-size:13px;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pills i{width:9px;height:9px;border-radius:50%;display:inline-block}
.art .f1,.art .f2,.art .f3{animation:float 6s ease-in-out infinite}
.art .f2{animation-duration:7.5s;animation-delay:-2s}.art .f3{animation-duration:5s;animation-delay:-1s}
@keyframes float{50%{transform:translateY(-8px)}}

.ls .rt{display:grid;gap:8px;justify-items:end;flex:none}
.go,.ob{min-height:48px;border-radius:14px;padding:0 16px;font-weight:800;cursor:pointer;transition:transform .15s}
.go{border:0;background:var(--p);color:var(--on)}
.ob{border:1px solid var(--ln);background:var(--sf);color:var(--ink)}
.go:active,.ob:active{transform:scale(.96)}
.ls.flash{animation:flash 1.1s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--ok) 24%,transparent)}to{background:transparent}}
.lr{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln)}
.lr:last-child{border:0}
.lr .g{flex:1;min-width:0}.lr .g b{display:block;font-size:15px;line-height:1.3}
.bk{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--vi);color:#fff;flex:none;box-shadow:0 8px 18px color-mix(in srgb,var(--vi) 38%,transparent)}
.bk svg{width:24px;height:24px}
.card.pass{padding:0;overflow:hidden}
.pass .ph{position:relative;padding:16px;color:#fff;background:linear-gradient(135deg,#4B3A9A,#7C5CD6);overflow:hidden}
.pass .ph:after{content:"";position:absolute;right:0;top:0;bottom:0;width:46%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.2) 0 2px,transparent 2px 7px,rgba(255,255,255,.12) 7px 9px,transparent 9px 14px);-webkit-mask-image:linear-gradient(90deg,transparent,#000);mask-image:linear-gradient(90deg,transparent,#000)}
.pass .ph b{position:relative;z-index:1;font-size:17px;font-weight:800}
.pass .pb{display:flex;gap:18px;align-items:center;padding:18px 16px;flex-wrap:wrap}
.qb{background:#fff;border-radius:14px;padding:10px;width:150px;height:150px;flex:none;box-shadow:0 0 0 1px var(--ln)}.qb svg{width:100%;height:100%;display:block}
.pass .pi{flex:1;min-width:150px}.pass .pi b{display:block;font-size:17px;line-height:1.3}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}
</style></head><body>

<div class="bg" aria-hidden="true">
 <i class="b1"></i><i class="b2"></i>
 <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width=".6"><circle cx="100" cy="100" r="96" stroke-dasharray="2 5"/><circle cx="100" cy="100" r="74"/><circle cx="100" cy="100" r="52" stroke-dasharray="1 4"/><circle cx="100" cy="100" r="30"/><path d="M100 4v192M4 100h192"/></svg>
</div>

<main id="m"></main>
<nav class="nv" id="nv" aria-label="Bo'limlar"></nav>
<div class="toast" id="ts" role="status" aria-live="polite"></div>

<script>
/* ===== kirgan talabani tekshirish (ma'lumot talaba/index.html'dan sessionStorage orqali keladi) ===== */
function ses(){try{var u=JSON.parse(sessionStorage.getItem("hemis_talaba"));return u&&u.id&&u.name&&typeof u.s=="number"?u:null}catch(x){return null}}
var U=ses();
if(!U){location.replace("/talaba/")}else{start()}

function start(){
var $=i=>document.getElementById(i);
var MN=["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
/* NAMUNA (demo) ma'lumotlar: topshiriqlar va adabiyotlar. [fan, nomi, muddati, yuborilgan(1/0)] */
var TS=[["Soliq tizimida dasturiy mahsullar","Topshiriq: Amaliy",new Date(2026,10,15,19,20),1],["Soliq huquqi","Referat: Soliq majburiyati",new Date(2026,9,25,23,59),0],["Yuridik shaxslarni soliqqa tortish","Amaliy ish: Foyda solig'i hisobi",new Date(2026,10,1,18,0),0],["Kelajak soati","Esse: Kasbiy yo'nalish",new Date(2026,9,10,20,0),0]],
LB=[["Soliq huquqi","O'zbekiston Respublikasi Soliq kodeksi","Qonun"],["Yuridik shaxslarni soliqqa tortish","Soliq huquqi bo'yicha o'quv qo'llanma","Qo'llanma"],["Soliq tizimida dasturiy mahsullar","Soliq hisobotini topshirish yo'riqnomasi","Yo'riqnoma"]];
/* yuborilgan topshiriqlar shu brauzer oynasida saqlanadi: {"1":1} */
try{var sv=JSON.parse(sessionStorage.getItem("hemis_ts"));if(sv&&typeof sv=="object")Object.keys(sv).forEach(k=>{if(TS[k])TS[k][3]=1})}catch(x){}
function saveTS(){var o={};TS.forEach((t,i)=>{if(t[3])o[i]=1});try{sessionStorage.setItem("hemis_ts",JSON.stringify(o))}catch(x){}}

var esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
var pad=n=>(n<10?"0":"")+n,dl=d=>`${d.getDate()}-${MN[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
var rm=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
function toast(m){var t=$("ts");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2400)}
function left(d){var ms=d-new Date(),a=Math.abs(ms),k=Math.floor(a/864e5),s=Math.floor(a%864e5/36e5),m=Math.floor(a%36e5/6e4),
 t=k>0?k+" kun"+(s?" "+s+" soat":""):s>0?s+" soat"+(m?" "+m+" daqiqa":""):Math.max(1,m)+" daqiqa";return ms>0?t+" qoldi":t+" oldin tugagan"}

/* ===== kod bilan chizilgan rasmlar ===== */
var IC={
 bk:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/>',
 ho:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 ta:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6"/>',
 ja:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 ha:'<path d="M3 8a2 2 0 0 1 2-2h13v3"/><rect x="3" y="8" width="18" height="12" rx="3"/><circle cx="16.5" cy="14" r="1"/>',
 sh:'<circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/>',
 mo:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
 su:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/>'
};
var svg=(k,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.9}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
var ART='<svg class="art" viewBox="0 0 200 140" fill="none" aria-hidden="true">'
+'<g class="f1"><g transform="rotate(-18 120 70)"><rect x="58" y="56" width="12" height="16" rx="3" fill="#E5484D"/><rect x="70" y="56" width="104" height="16" rx="2" fill="#F5C518"/><rect x="70" y="56" width="104" height="4" fill="#fff" fill-opacity=".35"/><path d="M174 56l22 8-22 8z" fill="#F4D9B0"/><path d="M190 61.500l6 2.500-6 2.500z" fill="#2B2B33"/></g></g>'
+'<g class="f2"><g transform="rotate(8 52 100)"><rect x="22" y="62" width="62" height="74" rx="9" fill="#fff" fill-opacity=".92"/><path d="M34 82h38M34 94h38M34 106h24" stroke="#7C5CD6" stroke-width="3" stroke-linecap="round"/></g></g>'
+'<circle class="f3" cx="30" cy="22" r="4" fill="#fff" fill-opacity=".45"/><circle class="f3" cx="150" cy="18" r="7" stroke="#fff" stroke-opacity=".5" stroke-width="2"/></svg>';

/* kutubxona a'zolik QR (namuna: har bir talaba uchun ID'dan hisoblanadi) */
function qr(id,seed){var s=seed||Math.floor(Math.random()*1e9),r=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff,h="";
 for(var y=0;y<21;y++)for(var x=0;x<21;x++){var f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13),on;
  if(f){var ax=x>13?x-14:x,ay=y>13?y-14:y;on=ax==0||ax==6||ay==0||ay==6||(ax>1&&ax<5&&ay>1&&ay<5)}else on=r()>.5;
  if(on)h+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 $(id).innerHTML=`<svg viewBox="0 0 21 21" fill="#1B365D" shape-rendering="crispEdges">${h}</svg>`}

/* ===== topshiriqlar ===== */
function cnt(){var n=new Date(),a={ok:0,wt:0,no:0};TS.forEach(t=>{if(t[3])a.ok++;else if(n>t[2])a.no++;else a.wt++});return a}
function tasks(fl){var n=new Date();
 return TS.map((t,i)=>{var sent=t[3],ex=!sent&&n>t[2],
  tag=sent?'<span class="tag ok">Yuborilgan</span>':ex?'<span class="tag no">Muddati o\'tgan</span>':'<span class="tag bl">Kutilmoqda</span>';
  return`<div class="ls ${sent?"ok":ex?"no":""}${fl===i?" flash":""}"><div class="g"><b>${esc(t[1])}</b><span class="mut">${esc(t[0])}</span><div class="mut" style="margin-top:3px">Muddati: <b style="color:var(--ink)">${dl(t[2])}</b>${sent?"":", "+left(t[2])}</div></div><div class="rt">${tag}${sent||ex?"":`<button class="go" data-s="${i}">Yuborish</button>`}</div></div>`}).join("")}

var C=2*Math.PI*40,first=true;
function hero(){var a=cnt(),n=new Date(),tot=TS.length,nx=null;
 TS.forEach(t=>{if(!t[3]&&n<=t[2]&&(!nx||t[2]<nx[2]))nx=t});
 $("nxT").textContent=nx?nx[1]:"Kutilayotgan topshiriq yo'q";
 $("nxS").textContent=nx?nx[0]+", "+left(nx[2]):(a.no?"Muddati o'tgan topshiriqlar: "+a.no+" ta":"Hammasi yuborilgan");
 $("rgN").textContent=a.ok+"/"+tot;
 $("pl").innerHTML=`<span><i style="background:#7FE0B5"></i>Yuborilgan ${a.ok}</span><span><i style="background:#8DB8F5"></i>Kutilmoqda ${a.wt}</span><span><i style="background:#FF8A8E"></i>Muddati o'tgan ${a.no}</span>`;
 var set=()=>{$("pr").style.strokeDashoffset=C*(1-a.ok/tot)};
 if(first&&!rm()){first=false;setTimeout(set,450)}else{first=false;set()}}

/* ===== sahifa ===== */
function page(){
 $("m").innerHTML=`
 <header class="top rise" style="--i:0"><div><h1>Ta'lim</h1><div class="chips"><span>ST-50/24</span><span>5-semestr</span></div></div>
  <div class="tr"><button class="ib" id="th" aria-label="Tungi va kunduzgi rejim"></button><button class="xb" id="ex">Chiqish</button></div></header>

 <section class="hero rise" style="--i:1" id="hr" aria-label="Topshiriqlar holati">${ART}
  <div class="hr1"><div class="hl"><small>Keyingi muddat</small><b class="nx" id="nxT"></b><span class="cd" id="nxS"></span></div>
   <div class="rg" role="img" aria-label="Yuborilgan topshiriqlar"><svg viewBox="0 0 96 96" fill="none" stroke-width="9"><circle class="tk" cx="48" cy="48" r="40"/><circle class="pr" id="pr" cx="48" cy="48" r="40" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="rn"><b id="rgN"></b><span>yuborilgan</span></div></div></div>
  <div class="pills" id="pl"></div>
 </section>

 <div class="sec rise" style="--i:2"><h2>Topshiriqlar</h2><span class="mut">${TS.length} ta</span></div>
 <div class="card rise" style="--i:2" id="tk">${tasks()}</div>

 <div class="sec rise" style="--i:3"><h2>Adabiyotlar</h2><span class="mut">${LB.length} ta</span></div>
 <div class="card rise" style="--i:3" id="lb">${LB.map((b,i)=>`<div class="lr"><div class="bk">${svg("bk")}</div><div class="g"><b>${esc(b[1])}</b><span class="mut">${esc(b[0])}, ${esc(b[2])}</span></div><button class="ob" data-o="${i}">Ochish</button></div>`).join("")}</div>

 <div class="sec rise" style="--i:4"><h2>Kutubxonaga a'zolik</h2></div>
 <div class="card pass rise" style="--i:4"><div class="ph"><b>Kutubxona a'zolik kartasi</b></div>
  <div class="pb"><div class="qb" id="lq" role="img" aria-label="A'zolik QR kodi"></div>
   <div class="pi"><b>${esc(U.name)}</b><div class="mut" style="margin-top:4px">A'zolik raqami: KT-${esc(U.id.slice(-6))}</div><div style="margin-top:8px"><span class="tag ok">Faol</span></div><p class="mut" style="margin-top:10px">Kutubxonada skanerga ko'rsating</p></div></div></div>
 <p class="note rise" style="--i:5">Topshiriqlar, adabiyotlar va a'zolik raqami namuna (demo) ma'lumotlar.</p>`;
 qr("lq",U.s);hero();
 $("tk").onclick=e=>{var b=e.target.closest&&e.target.closest("[data-s]");if(!b)return;var i=+b.dataset.s;TS[i][3]=1;saveTS();$("tk").innerHTML=tasks(i);hero();toast("Topshiriq yuborildi")};
 $("lb").onclick=e=>{if(e.target.closest&&e.target.closest("[data-o]"))toast("Fayl tez orada ulanadi")};
 $("th").onclick=theme;$("ex").onclick=out;
 var h=$("hr");if(matchMedia("(hover:hover)").matches&&!rm())h.addEventListener("pointermove",e=>{var r=h.getBoundingClientRect();h.style.setProperty("--mx",((e.clientX-r.left)/r.width*100)+"%");h.style.setProperty("--my",((e.clientY-r.top)/r.height*100)+"%")});
 setIcon()}

/* tungi rejim, chiqish */
function isDark(){var r=document.documentElement;return r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function setIcon(){$("th").innerHTML=svg(isDark()?"su":"mo")}
function theme(){var r=document.documentElement,v=isDark()?"light":"dark";r.dataset.theme=v;try{localStorage.setItem("hemis_theme",v)}catch(x){}setIcon()}
function out(){try{["hemis_talaba","hemis_m","hemis_scn","hemis_ts"].forEach(k=>sessionStorage.removeItem(k))}catch(x){}location.replace("/talaba/")}

/* pastki navigatsiya: har bo'lim alohida sahifa */
var T=[["Asosiy","/talaba/asosiy/","ho"],["Ta'lim","/talaba/talim/","ta"],["Jadval","/talaba/jadval/","ja"],["Hamyon","/talaba/hamyon/","ha"],["Shaxsiy","/talaba/shaxsiy/","sh"]];
$("nv").innerHTML=T.map((t,i)=>`<a href="${t[1]}"${i==1?' aria-current="page"':""}>${svg(t[2],1.8)}${t[0]}</a>`).join("");

page();
setInterval(()=>{$("tk").innerHTML=tasks();hero()},60000);
}
</script></body></html>
