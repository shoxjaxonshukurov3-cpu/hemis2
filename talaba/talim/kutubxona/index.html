.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg:before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.5px);background-size:24px 24px;-webkit-mask-image:linear-gradient(#000 0,transparent 62%);mask-image:linear-gradient(#000 0,transparent 62%)}

main{max-width:720px;margin:0 auto;padding:18px 16px 118px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.ava{width:52px;height:52px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--b2),var(--vi),var(--ok));flex:none}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 10px}

.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:8px 16px;box-shadow:var(--sh)}

.ls .tm{width:48px;flex:none;line-height:1.25}.ls .tm b{display:block;font-size:14px}.ls .tm span{font-size:12px;color:var(--mut);font-weight:700}

.pgb i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--bl),var(--b2));transition:width 1s linear}
.tag{font-size:12px;font-weight:800;padding:5px 11px;border-radius:20px;white-space:nowrap;flex:none}
.tag.ok{background:rgba(34,160,107,.16);color:var(--ok)}.tag.no{background:rgba(229,72,77,.14);color:var(--er)}

.empty{display:flex;align-items:center;gap:14px;padding:16px 0}

.note{margin:16px 4px 0;font-size:12.5px;color:var(--mut)}

/* ===== pastki navigatsiya ===== */
.nv{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--sf) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0))}

.lr{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln)}
.lr:last-child{border:0}
.lr .g{flex:1;min-width:0}.lr .g b{display:block;font-size:15px;line-height:1.3}
.lr .rt{display:grid;gap:6px;justify-items:end;flex:none}
.bk{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--vi);color:#fff;flex:none;box-shadow:0 8px 18px color-mix(in srgb,var(--vi) 38%,transparent)}

function topbar(title,sub,back){return `<header class="top rise" style="--i:0"><div class="tr">${back?`<a class="ib" href="/talaba/talim/" aria-label="Ta'limga qaytish">${svg("lf")}</a>`:""}<div><h1>${title}</h1>${sub}</div></div><div class="tr"><button class="ib" id="th" aria-label="Tungi va kunduzgi rejim"></button><button class="xb" id="ex">Chiqish</button></div></header>`}
function wire(){$("th").onclick=theme;$("ex").onclick=out;setIcon();
 var h=$("hr");if(h&&matchMedia("(hover:hover)").matches&&!rm())h.addEventListener("pointermove",e=>{var r=h.getBoundingClientRect();h.style.setProperty("--mx",((e.clientX-r.left)/r.width*100)+"%");h.style.setProperty("--my",((e.clientY-r.top)/r.height*100)+"%")})}

function qr(id,seed){var s=seed||Math.floor(Math.random()*1e9),r=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff,h="";
 for(var y=0;y<21;y++)for(var x=0;x<21;x++){var f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13),on;
  if(f){var ax=x>13?x-14:x,ay=y>13?y-14:y;on=ax==0||ax==6||ay==0||ay==6||(ax>1&&ax<5&&ay>1&&ay<5)}else on=r()>.5;
  if(on)h+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 $(id).innerHTML=`<svg viewBox="0 0 21 21" fill="#1B365D" shape-rendering="crispEdges">${h}</svg>`}
var ART='<svg class="art" viewBox="0 0 200 140" fill="none" aria-hidden="true"><g class="f1"><g transform="rotate(-10 100 70)"><rect x="54" y="40" width="90" height="62" rx="9" fill="#fff" fill-opacity=".22"/><rect x="62" y="48" width="74" height="46" rx="5" fill="#fff" fill-opacity=".92"/><path d="M70 62h40M70 74h28" stroke="#4B3A9A" stroke-width="4" stroke-linecap="round"/></g></g><g class="f2"><circle cx="160" cy="34" r="12" fill="#22A06B"/><path d="M154 34l4 4 8-8" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><circle class="f3" cx="34" cy="26" r="4" fill="#fff" fill-opacity=".5"/></svg>';
var today=()=>{var t=new Date();t.setHours(0,0,0,0);return t},dayDiff=d=>Math.round((d-today())/864e5);
function state(b){if(b[5])return{c:"ok",t:'<span class="tag ok">Qaytarilgan</span>'};var k=dayDiff(b[4]);
 return k<0?{c:"no",t:`<span class="tag no">${-k} kun kechikkan</span>`}:k==0?{c:"",t:'<span class="tag bl">Bugun qaytariladi</span>'}:{c:"",t:`<span class="tag bl">${k} kun qoldi</span>`}}
var tab=0;
function row(b){var s=state(b);return`<div class="lr"><div class="bk ${s.c}">${svg("bk")}</div><div class="g"><b>${esc(b[0])}</b><span class="mut">${esc(b[1])}, ${esc(b[2])}</span><div class="mut" style="margin-top:3px">Olingan: ${dd(b[3])} · ${b[5]?"qaytarilgan: "+dd(b[5]):"qaytarish: <span style=\"color:var(--ink);font-weight:800\">"+dd(b[4])+"</span>"}</div><div style="margin-top:8px">${s.t}</div></div></div>`}
function list(){var hand=BK.filter(b=>!b[5]),back=BK.filter(b=>b[5]);
 if(tab==0)return`<div class="lab">Hozir qo'lingizda (${hand.length})</div><div class="card" style="padding:4px 16px">${hand.length?hand.map(row).join(""):'<p class="mut" style="padding:14px 0">Qo\'lingizda kitob yo\'q</p>'}</div>
  <div class="lab" style="margin-top:18px">Qaytarilgan (${back.length})</div><div class="card" style="padding:4px 16px">${back.length?back.map(row).join(""):'<p class="mut" style="padding:14px 0">Qaytarilgan kitob yo\'q</p>'}</div>`;
 return`<p class="mut" style="margin:0 2px 10px">Kutubxonada bor va hozir hech kimga berilmagan kitoblar.</p><div class="card" style="padding:4px 16px">${AV.map(b=>`<div class="lr"><div class="bk ok">${svg("bk")}</div><div class="g"><b>${esc(b[0])}</b><span class="mut">${esc(b[1])}, ${esc(b[2])}</span><div style="margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="tag ok">Berilmagan</span><span class="mut">${b[3]} ta nusxa</span></div></div></div>`).join("")}</div>`}
function render(){var hand=BK.filter(b=>!b[5]),od=hand.filter(b=>dayDiff(b[4])<0).length;
 $("m").innerHTML=`${topbar("Kutubxona",`<span class="mut">Kitoblar va a'zolik</span>`,true)}
 <section class="card pass rise" style="--i:1" id="hr" aria-label="Kutubxona a'zolik kartasi"><div class="ph"><b>A'zolik kartasi</b>${ART}</div>
  <div class="pb"><div class="qb" id="lq" role="img" aria-label="A'zolik QR kodi"></div>
   <div class="pi"><b>${esc(U.name)}</b><div class="mut" style="margin-top:4px">A'zolik raqami: KT-${esc(U.id.slice(-6))}</div><div style="margin-top:8px"><span class="tag ok">Faol</span></div><p class="mut" style="margin-top:10px">Kutubxonada skanerga ko'rsating</p></div></div></section>
 <div class="card st rise" style="--i:2"><div><b>${hand.length}</b><span class="mut">Qo'lingizda</span></div><div><b style="color:${od?"var(--er)":"var(--ok)"}">${od}</b><span class="mut">Kechikkan</span></div><div><b>${AV.length}</b><span class="mut">Berilmagan</span></div></div>
 <div class="seg rise" style="--i:3" id="sg" role="tablist" aria-label="Kitoblar ro'yxati"><button role="tab" id="t0" aria-selected="true" aria-controls="ls">Olingan (${BK.length})</button><button role="tab" id="t1" aria-selected="false" aria-controls="ls">Berilmagan (${AV.length})</button></div>
 <div class="rise" style="--i:3;margin-top:14px" id="ls" role="tabpanel" aria-labelledby="t0"></div>
 <p class="note rise" style="--i:4">Kitoblar, muddatlar va nusxalar soni namuna (demo) ma'lumotlar. A'zolik QR kodi ham namuna.</p>`;
 qr("lq",U.s);wire();draw();
 $("sg").onclick=e=>{var b=e.target.closest&&e.target.closest("[role=tab]");if(!b)return;tab=b.id=="t1"?1:0;draw()}}
function draw(){$("t0").setAttribute("aria-selected",tab==0);$("t1").setAttribute("aria-selected",tab==1);$("ls").setAttribute("aria-labelledby",tab?"t1":"t0");$("ls").innerHTML=list()}
render();

}
</script></body></html>
