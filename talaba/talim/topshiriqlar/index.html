<style>

*{box-sizing:border-box;margin:0}

/* ===== kod bilan chizilgan fon ===== */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg:before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.5px);background-size:24px 24px;-webkit-mask-image:linear-gradient(#000 0,transparent 62%);mask-image:linear-gradient(#000 0,transparent 62%)}

.bg .b1{width:360px;height:360px;right:-120px;top:-110px;background:var(--blob1);animation:drift 22s ease-in-out infinite alternate}
.bg .b2{width:300px;height:300px;left:-130px;top:46%;background:var(--blob2);animation:drift 28s ease-in-out infinite alternate-reverse}
.bg svg{position:absolute;right:-150px;top:-150px;width:420px;height:420px;color:var(--b2);opacity:.35;animation:spin 140s linear infinite}
@keyframes drift{to{transform:translate(-40px,50px) scale(1.12)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== sahifa ===== */
main{max-width:720px;margin:0 auto;padding:18px 16px 118px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.ava{width:52px;height:52px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--b2),var(--vi),var(--ok));flex:none}
.ava span{width:100%;height:100%;border-radius:50%;background:var(--sf);display:grid;place-items:center;font-weight:800;color:var(--ink);font-size:16px}
.chips{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.chips span{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:color-mix(in srgb,var(--b2) 16%,transparent);color:var(--ink)}
.tr{display:flex;gap:8px;align-items:center}
.ib,.xb{min-height:48px;border:1px solid var(--ln);background:var(--sf);border-radius:14px;cursor:pointer;font-weight:700;transition:transform .15s}
.ib{width:48px;display:grid;place-items:center}.xb{padding:0 16px}
.ib:active,.xb:active{transform:scale(.96)}
.ib svg{width:22px;height:22px}

/* ===== bugungi darslar ===== */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 10px}
.sec .mut{font-weight:700}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:8px 16px;box-shadow:var(--sh)}
.ls{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln);position:relative}
.ls:last-child{border:0}
.ls:before{content:"";width:4px;align-self:stretch;border-radius:4px;background:var(--bl);flex:none}
.ls.ok:before{background:var(--ok)}.ls.no:before{background:var(--er)}
.ls .tm{width:48px;flex:none;line-height:1.25}.ls .tm b{display:block;font-size:14px}.ls .tm span{font-size:12px;color:var(--mut);font-weight:700}
.ls .g{flex:1;min-width:0}.ls .g b{display:block;font-size:15px;line-height:1.3}
.pgb{height:5px;border-radius:5px;background:var(--ln);margin-top:8px;overflow:hidden}
.pgb i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--bl),var(--b2));transition:width 1s linear}
.tag{font-size:12px;font-weight:800;padding:5px 11px;border-radius:20px;white-space:nowrap;flex:none}
.tag.ok{background:rgba(34,160,107,.16);color:var(--ok)}.tag.no{background:rgba(229,72,77,.14);color:var(--er)}
.tag.bl{background:rgba(59,130,246,.16);color:var(--bl)}
.tag .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bl);margin-right:6px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.7);opacity:.35}}
.empty{display:flex;align-items:center;gap:14px;padding:16px 0}
.empty svg{width:56px;height:56px;flex:none}
.note{margin:16px 4px 0;font-size:12.5px;color:var(--mut)}

/* ===== pastki navigatsiya ===== */
.nv{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--sf) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0))}
.nv a{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;text-decoration:none;color:var(--mut);font-weight:700;font-size:11px;transition:background .2s,color .2s}
.nv a svg{width:23px;height:23px}
.nv a[aria-current]{color:var(--p);background:color-mix(in srgb,var(--p) 14%,transparent)}
.nv a[aria-current] svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}

/* ===== sahifa ochilishi: bitta tartibli ketma-ketlik ===== */

 *,*:before,*:after{animation:none!important;transition:none!important}
 .rise{opacity:1;transform:none}

.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.pills svg{width:16px;height:16px}
.art .spin{transform-origin:150px 62px;transform-box:view-box;animation:spin 40s linear infinite}

.art .f1,.art .f2,.art .f3{animation:float 6s ease-in-out infinite}
.art .f2{animation-duration:7.5s;animation-delay:-2s}.art .f3{animation-duration:5s;animation-delay:-1s}
@keyframes float{50%{transform:translateY(-9px)}}
.ls .rt{display:grid;gap:8px;justify-items:end;flex:none}
.ls.flash{animation:flash 1.4s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--ok) 26%,transparent)}to{background:transparent}}
.fc{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 10px 6px 6px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);min-width:0;max-width:100%}
.fc .fi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--bl);color:#fff;flex:none}
.fc .fi svg{width:17px;height:17px}.fc .fi.rasm{background:var(--ok)}.fc .fi.video{background:var(--vi)}
.fc .fn{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fc .fz{color:var(--mut);font-size:12px;font-weight:700;flex:none}
.op{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:10px 14px;margin-top:10px;border:1px solid var(--ln);border-radius:16px;background:var(--sf);cursor:pointer;text-align:left;transition:transform .15s,border-color .2s;--a:var(--bl)}

.op .ic svg{width:24px;height:24px}
.op b{display:block;font-size:17px;font-weight:800}.op span{color:var(--mut);font-size:12.5px}
.tsk .th{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

function theme(){var r=document.documentElement,v=isDark()?"light":"dark";r.dataset.theme=v;try{localStorage.setItem("hemis_theme",v)}catch(x){}setIcon()}
function out(){try{["hemis_talaba","hemis_m","hemis_scn","hemis_ts","hemis_perm"].forEach(k=>sessionStorage.removeItem(k))}catch(x){}location.replace("/talaba/")}
var T=[["Asosiy","/talaba/asosiy/","ho"],["Ta'lim","/talaba/talim/","ta"],["Jadval","/talaba/jadval/","ja"],["Hamyon","/talaba/hamyon/","ha"],["Shaxsiy","/talaba/shaxsiy/","sh"]];
$("nv").innerHTML=T.map((t,i)=>`<a href="${t[1]}"${i==1?' aria-current="page"':""}>${svg(t[2],1.8)}${t[0]}</a>`).join("");
function topbar(title,sub,back){return `<header class="top rise" style="--i:0"><div class="tr">${back?`<a class="ib" href="/talaba/talim/" aria-label="Ta'limga qaytish">${svg("lf")}</a>`:""}<div><h1>${title}</h1>${sub}</div></div><div class="tr"><button class="ib" id="th" aria-label="Tungi va kunduzgi rejim"></button><button class="xb" id="ex">Chiqish</button></div></header>`}
function wire(){$("th").onclick=theme;$("ex").onclick=out;setIcon();
 var h=$("hr");if(h&&matchMedia("(hover:hover)").matches&&!rm())h.addEventListener("pointermove",e=>{var r=h.getBoundingClientRect();h.style.setProperty("--mx",((e.clientX-r.left)/r.width*100)+"%");h.style.setProperty("--my",((e.clientY-r.top)/r.height*100)+"%")})}

var ART='<svg class="art" viewBox="0 0 230 154" fill="none" aria-hidden="true"><defs><linearGradient id="ug" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#BFD6FF"/></linearGradient></defs>'
+'<g class="spin"><circle cx="150" cy="62" r="56" stroke="#fff" stroke-opacity=".2" stroke-dasharray="3 7"/></g>'
+'<circle cx="150" cy="62" r="36" stroke="#fff" stroke-opacity=".16"/><circle cx="150" cy="62" r="76" stroke="#fff" stroke-opacity=".08"/>'
+'<g class="f1"><g fill="url(#ug)"><circle cx="138" cy="66" r="18"/><circle cx="164" cy="56" r="25"/><circle cx="190" cy="70" r="15"/><rect x="126" y="66" width="78" height="22" rx="11"/></g><path d="M165 96V64M153 76l12-12 12 12" stroke="#1B365D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>'
+'<g class="f2"><circle cx="196" cy="24" r="11" fill="#7C5CD6"/><path d="M192.500 19l9 5-9 5z" fill="#fff"/></g>'
+'<circle class="f3" cx="104" cy="118" r="6" fill="#fff" fill-opacity=".35"/><circle class="f3" cx="92" cy="32" r="3.500" fill="#fff" fill-opacity=".45"/></svg>';

/* yuklash turlari: rasm, fayl yoki video (shulardan biri). Hajm chegaralari namuna */
var KD={rasm:{n:"Rasm",f:"JPG, PNG, HEIC",acc:"image/*",mt:/^image\//,ext:/\.(jpe?g|png|gif|webp|heic|heif|bmp)$/i,max:10,ic:"im",a:"#22A06B"},
 fayl:{n:"Fayl",f:"PDF, Word, PowerPoint, Excel, ZIP",acc:".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.zip,.rar",mt:null,ext:/\.(pdf|docx?|pptx?|xlsx?|txt|zip|rar)$/i,max:25,ic:"fi",a:"#3B82F6"},
 video:{n:"Video",f:"MP4, MOV",acc:"video/*",mt:/^video\//,ext:/\.(mp4|mov|m4v|webm|avi|3gp|mkv)$/i,max:100,ic:"vi",a:"#7C5CD6"}};

function tasks(fl){var n=new Date();
 return TS.map((t,i)=>{var sent=t[3],closed=n>t[2],ex=!sent&&closed,s=SUB[i],
  tag=sent?'<span class="tag ok">Yuborilgan</span>':ex?'<span class="tag no">Muddati o\'tgan</span>':'<span class="tag bl">Kutilmoqda</span>',
  fc=s?`<div class="fc"><span class="fi ${s.k}">${svg(KD[s.k].ic)}</span><span class="fn">${esc(s.n)}</span><span class="fz">${s.s?sz(s.s):""}</span></div>`:"",
  btn=closed?"":sent?`<button class="ob" data-s="${i}">Almashtirish</button>`:`<button class="go" data-s="${i}">Yuborish</button>`;
  return`<div class="ls tsk ${sent?"ok":ex?"no":""}${fl===i?" flash":""}"><div class="g"><div class="th"><b>${esc(t[1])}</b>${tag}</div><span class="mut">${esc(t[0])}</span><div class="mut" style="margin-top:3px">Muddati: <span style="color:var(--ink);font-weight:800">${dl(t[2])}</span></div>${sent?"":`<div class="mut">${left(t[2])}</div>`}${fc}${btn}</div></div>`}).join("")}
function hero(){var a=cnt();
 $("hN").innerHTML=a.wt+"<em>ta kutilmoqda</em>";
 $("hS").textContent=`Yuborilgan ${a.ok} ta`+(a.no?`, muddati o'tgan ${a.no} ta`:"");}

/* ===== yuborish oynasi (pastdan chiqadi): Yuklash tugmasi, so'ng Rasm / Fayl / Video ===== */
var shOp=null,shI=-1;
function sheetOpen(i,opener){shI=i;shOp=opener;var t=TS[i],re=!!t[3];
 $("sh").innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-labelledby="sht"><div class="hd"><h2 id="sht">${re?"Faylni almashtirish":"Topshiriq yuborish"}</h2><button class="ib" id="sx" aria-label="Yopish">${svg("x")}</button></div>
  <div class="tk"><div><b>${esc(t[1])}</b><span class="mut">${esc(t[0])} · muddati ${dl(t[2])}</span></div></div>
  <div id="st1"><button class="btn" id="up" style="margin-top:14px;display:flex;align-items:center;justify-content:center;gap:10px"><span style="width:22px;height:22px;display:inline-block">${svg("up")}</span>Yuklash</button></div>
  <div id="st2" class="hid"><p class="mut" style="margin:14px 0 2px;font-weight:700">Birini tanlang:</p>${["rasm","fayl","video"].map(k=>`<button class="op" data-k="${k}" style="--a:${KD[k].a}"><div class="ic">${svg(KD[k].ic)}</div><div><b>${KD[k].n}</b><span>${KD[k].f} · ${KD[k].max} MB gacha</span></div></button>`).join("")}</div>
  <p class="err" id="se" role="alert"></p>
  <p class="mut">Server hali yo'q: fayl hech qayerga yuborilmaydi, faqat uning nomi shu brauzer oynasida saqlanadi.</p></div>`;
 $("sh").classList.remove("hid");document.body.style.overflow="hidden";
 $("sx").onclick=sheetShut;$("sh").onclick=e=>{if(e.target===$("sh"))sheetShut()};
 $("up").onclick=()=>{$("st1").classList.add("hid");$("st2").classList.remove("hid");$("st2").querySelector(".op").focus()};
 $("st2").onclick=e=>{var b=e.target.closest&&e.target.closest("[data-k]");if(b)pick(b.dataset.k)};
 $("up").focus()}
function sheetShut(){$("sh").classList.add("hid");$("sh").innerHTML="";document.body.style.overflow="";if(shOp&&shOp.focus&&document.contains(shOp))shOp.focus()}
function pick(k){var d=KD[k],inp=document.createElement("input");inp.type="file";inp.accept=d.acc;inp.className="hid";document.body.appendChild(inp);
 inp.onchange=()=>{var f=inp.files&&inp.files[0];inp.remove();if(!f)return;var e=m=>{$("se").textContent=m};
  if(!((d.mt&&d.mt.test(f.type))||d.ext.test(f.name)))return e(d.n+" tanlang: "+d.f+".");
  if(f.size>d.max*1048576)return e("Hajmi "+d.max+" MB dan oshmasin ("+sz(f.size)+").");
  if(!f.size)return e("Fayl bo'sh.");
  var i=shI;TS[i][3]=1;SUB[i]={k:k,n:f.name.slice(0,120),s:f.size};saveTS();sheetShut();
  $("tk").innerHTML=tasks(i);hero();toast("Topshiriq yuborildi: "+f.name)};
 inp.addEventListener("cancel",()=>inp.remove());inp.click()}
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&!$("sh").classList.contains("hid"))sheetShut()});

function render(){var a=cnt();
 $("m").innerHTML=`${topbar("Topshiriqlar",`<span class="mut">${TS.length} ta topshiriq</span>`,true)}
 <section class="hero rise" style="--i:1" id="hr" aria-label="Topshiriqlar holati">${ART}
  <small>Yuborish uchun</small><span class="big" id="hN"></span><span class="hs" id="hS"></span>
  <div class="pills"><span>${svg("im")}Rasm</span><span>${svg("fi")}Fayl</span><span>${svg("vi")}Video</span></div>
 </section>
 <div class="sec rise" style="--i:2"><h2>Barcha topshiriqlar</h2><span class="mut">${TS.length} ta</span></div>
 <div class="card rise" style="--i:2" id="tk">${tasks()}</div>
 <p class="note rise" style="--i:3">Topshiriqlar namuna (demo) ma'lumotlar. Yuborish uchun rasm, fayl yoki videodan birini tanlaysiz.</p>`;
 hero();wire();
 $("tk").onclick=e=>{var b=e.target.closest&&e.target.closest("[data-s]");if(b)sheetOpen(+b.dataset.s,b)}}
render();
setInterval(()=>{if($("sh").classList.contains("hid")){$("tk").innerHTML=tasks();hero()}},60000);

}
</script></body></html>
