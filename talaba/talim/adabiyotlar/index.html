<style>

 mo:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
 su:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/>',
 lf:'<path d="M15 5l-7 7 7 7"/>',rt:'<path d="M9 5l7 7-7 7"/>',dn:'<path d="M6 9l6 6 6-6"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
 up:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
 im:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5-5 4 4 3-3 4 4"/>',
 fi:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
 vi:'<rect x="3" y="5" width="14" height="14" rx="3"/><path d="M17 10l4-2v8l-4-2z"/>',
 pr:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8M10 8l4 2-4 2z"/>'
};
var svg=(k,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.9}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

/* ===== tungi rejim, chiqish, navigatsiya ===== */
function isDark(){var r=document.documentElement;return r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function setIcon(){$("th").innerHTML=svg(isDark()?"su":"mo")}
function theme(){var r=document.documentElement,v=isDark()?"light":"dark";r.dataset.theme=v;try{localStorage.setItem("hemis_theme",v)}catch(x){}setIcon()}
function out(){try{["hemis_talaba","hemis_m","hemis_scn","hemis_ts","hemis_perm"].forEach(k=>sessionStorage.removeItem(k))}catch(x){}location.replace("/talaba/")}
var T=[["Asosiy","/talaba/asosiy/","ho"],["Ta'lim","/talaba/talim/","ta"],["Jadval","/talaba/jadval/","ja"],["Hamyon","/talaba/hamyon/","ha"],["Shaxsiy","/talaba/shaxsiy/","sh"]];
$("nv").innerHTML=T.map((t,i)=>`<a href="${t[1]}"${i==1?' aria-current="page"':""}>${svg(t[2],1.8)}${t[0]}</a>`).join("");
function topbar(title,sub,back){return `<header class="top rise" style="--i:0"><div class="tr">${back?`<a class="ib" href="/talaba/talim/" aria-label="Ta'limga qaytish">${svg("lf")}</a>`:""}<div><h1>${title}</h1>${sub}</div></div><div class="tr"><button class="ib" id="th" aria-label="Tungi va kunduzgi rejim"></button><button class="xb" id="ex">Chiqish</button></div></header>`}
function wire(){$("th").onclick=theme;$("ex").onclick=out;setIcon();
 var h=$("hr");if(h&&matchMedia("(hover:hover)").matches&&!rm())h.addEventListener("pointermove",e=>{var r=h.getBoundingClientRect();h.style.setProperty("--mx",((e.clientX-r.left)/r.width*100)+"%");h.style.setProperty("--my",((e.clientY-r.top)/r.height*100)+"%")})}

var COL=["#7C5CD6","#3B82F6","#22A06B","#F59E0B"];
var ART='<svg class="art" viewBox="0 0 230 154" fill="none" aria-hidden="true"><defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EADFFF"/><stop offset="1" stop-color="#8FB4F0"/></linearGradient></defs>'
+'<g class="spin"><circle cx="150" cy="62" r="56" stroke="#fff" stroke-opacity=".2" stroke-dasharray="3 7"/></g>'
+'<circle cx="150" cy="62" r="36" stroke="#fff" stroke-opacity=".16"/><circle cx="150" cy="62" r="76" stroke="#fff" stroke-opacity=".08"/>'
+'<g class="f1"><g transform="rotate(-6 156 70)"><rect x="116" y="74" width="82" height="16" rx="4" fill="#F59E0B"/><rect x="120" y="58" width="74" height="16" rx="4" fill="url(#ag)"/><rect x="112" y="42" width="80" height="16" rx="4" fill="#7FE0B5"/><path d="M122 50h30M126 66h30M122 82h30" stroke="#2B2370" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/></g></g>'
+'<g class="f2"><rect x="170" y="12" width="30" height="22" rx="4" fill="#fff" fill-opacity=".92"/><path d="M180 18l9 5-9 5z" fill="#7C5CD6"/></g>'
+'<circle class="f3" cx="104" cy="118" r="6" fill="#fff" fill-opacity=".35"/><circle class="f3" cx="92" cy="32" r="3.500" fill="#fff" fill-opacity=".45"/></svg>';

var FN=Object.keys(TP),DS=FN.reduce((a,k)=>a+TP[k].length,0);
function fans(){return FN.map((f,i)=>{var bs=LB.filter(b=>b[0]==f),ds=TP[f];
 return`<details class="fan rise" style="--i:${i+2};--a:${COL[i%4]}"${i==0?" open":""}><summary><div class="n">${i+1}</div><div class="g"><b>${esc(f)}</b><span class="mut">${ds.length} ta dars${bs.length?" · "+bs.length+" ta adabiyot":""}</span></div><svg class="chv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC.dn}</svg></summary>
  <div class="fb">${bs.length?`<div class="lab">Adabiyotlar</div>`+bs.map(b=>`<div class="lr"><div class="bk">${svg("bk")}</div><div class="g"><b>${esc(b[1])}</b><span class="mut">${esc(b[2])}</span></div><button class="ob" data-o="1">Ochish</button></div>`).join(""):""}
  <div class="lab">Darslar va prezentatsiyalar</div>${ds.map((d,j)=>`<div class="lr"><div class="dn">${j+1}</div><div class="g"><b>${esc(d)}</b><span class="mut">${j+1}-dars</span></div><button class="go" data-f="${i}" data-d="${j}">Prezentatsiya</button></div>`).join("")}</div></details>`}).join("")}

/* ===== prezentatsiya ko'rinishi (namuna: haqiqiy fayl hali ulanmagan) ===== */
var pvI=0,pvF=0,pvD=0,pvOp=null,tx=null;
function slides(){var f=FN[pvF],d=TP[f][pvD];
 return[`<div class="sl"><span class="tg">Prezentatsiya · namuna</span><h3>${esc(d)}</h3><p>${esc(f)} · ${pvD+1}-dars</p></div>`,
  `<div class="sl"><span class="tg">Dars rejasi · namuna</span><h3>Reja</h3><ol><li>Kirish</li><li>Asosiy qism</li><li>Xulosa</li></ol></div>`,
  `<div class="sl wn"><span class="tg">Eslatma</span><h3>Fayl hali ulanmagan</h3><p>O'qituvchi yuklagan prezentatsiya fayli shu yerda ko'rinadi. Hozir faqat ko'rinish namunasi.</p></div>`]}
function pvDraw(){var S=slides();$("pst").innerHTML=S[pvI];$("pc").textContent=(pvI+1)+" / "+S.length;
 $("pd").innerHTML=S.map((s,i)=>`<i class="${i==pvI?"on":""}"></i>`).join("");$("pp").disabled=pvI==0;$("pn").disabled=pvI==S.length-1;
 $("pp").style.opacity=pvI==0?".4":"";$("pn").style.opacity=pvI==S.length-1?".4":""}
function pvOpen(f,d,op){pvF=f;pvD=d;pvI=0;pvOp=op;var t=TP[FN[f]][d];
 $("pv").innerHTML=`<div class="ph"><div style="min-width:0"><span>${esc(FN[f])} · ${d+1}-dars</span><b>${esc(t)}</b></div><button class="ib" id="pxc" aria-label="Yopish">${svg("x")}</button></div>
  <div class="stg" id="pst" aria-live="polite"></div><div class="dts" id="pd"></div>
  <div class="ctl" style="margin-top:12px"><button class="ib" id="pp" aria-label="Oldingi slayd">${svg("lf")}</button><span id="pc"></span><button class="ib" id="pn" aria-label="Keyingi slayd">${svg("rt")}</button></div>`;
 $("pv").classList.remove("hid");document.body.style.overflow="hidden";
 $("pxc").onclick=pvShut;$("pp").onclick=()=>pvGo(-1);$("pn").onclick=()=>pvGo(1);
 var st=$("pst");st.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});st.addEventListener("touchend",e=>{if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)pvGo(dx<0?1:-1)},{passive:true});
 pvDraw();$("pn").focus()}
function pvGo(n){var L=slides().length,k=pvI+n;if(k<0||k>=L)return;pvI=k;pvDraw()}
function pvShut(){$("pv").classList.add("hid");$("pv").innerHTML="";document.body.style.overflow="";if(pvOp&&document.contains(pvOp))pvOp.focus()}
document.addEventListener("keydown",e=>{if($("pv").classList.contains("hid"))return;if(e.key=="Escape")pvShut();else if(e.key=="ArrowRight")pvGo(1);else if(e.key=="ArrowLeft")pvGo(-1)});

function render(){
 $("m").innerHTML=`${topbar("Adabiyotlar",`<span class="mut">${FN.length} fan · ${DS} ta dars</span>`,true)}
 <section class="hero rise" style="--i:1" id="hr" aria-label="Adabiyotlar"><small>Fanlar bo'yicha</small>${ART}<span class="big">${DS} ta dars prezentatsiyasi</span><span class="hs">${FN.length} fan, har bir dars uchun</span></section>
 <div class="sec rise" style="--i:2"><h2>Fanlar</h2><span class="mut">${FN.length} ta</span></div>
 <div class="fans" id="fn">${fans()}</div>
 <p class="note rise" style="--i:6">Fanlar, mavzular va adabiyotlar namuna (demo) ma'lumotlar. Prezentatsiya fayllari hali ulanmagan, ko'rinish namunasi chiqadi.</p>`;
 wire();
 $("fn").onclick=e=>{var b=e.target.closest&&e.target.closest("button");if(!b)return;
  if(b.dataset.f!==undefined)pvOpen(+b.dataset.f,+b.dataset.d,b);else if(b.dataset.o)toast("Fayl tez orada ulanadi")}}
render();

}
</script></body></html>
