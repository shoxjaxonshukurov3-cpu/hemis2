   /talaba/asosiy, /talaba/talim, /talaba/jadval, /talaba/hamyon, /talaba/shaxsiy */
var HOME="/talaba/asosiy",KEY="hemis_talaba";
function show(id){["v1","v2"].forEach(x=>$(x).classList.toggle("hid",x!=id))}
var hex=b=>Array.prototype.map.call(b,x=>("0"+x.toString(16)).slice(-2)).join("");
function unhex(s){var o=new Uint8Array(s.length/2);for(var i=0;i<o.length;i++)o[i]=parseInt(s.substr(i*2,2),16);return o}

/* 1. kirish */
$("lf").addEventListener("submit",async e=>{
 e.preventDefault();var v=$("id").value.trim(),er=$("le");er.textContent="";
 if(!/^\d{9}$/.test(v)){er.textContent="ID 9 ta raqamdan iborat bo'lishi kerak.";return}
 $("lb").disabled=true;$("lb").textContent="Tekshirilmoqda...";
 try{
  var en=new TextEncoder(),k=await crypto.subtle.importKey("raw",en.encode(v),"PBKDF2",false,["deriveBits"]);
  var d=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:en.encode(SALT),iterations:100000,hash:"SHA-256"},k,512));
  var h=hex(d.slice(0,16)),r=R.filter(x=>x.v==h)[0];
  if(!r){er.textContent="Bunday ID topilmadi.";return}
  var c=unhex(r.c),n=new Uint8Array(48);for(var i=0;i<48;i++)n[i]=c[i]^d[16+i];
  U={name:new TextDecoder().decode(n).trim(),id:v,gpa:(3.8+d[20]/255*1.2).toFixed(2),s:((d[24]<<24)|(d[25]<<16)|(d[26]<<8)|d[27])>>>0};
  face(enter,"Yuzni tasdiqlash","v1","Yuz tasdiqlandi");
 }catch(x){er.textContent="Brauzer bu amalni qo'llamaydi. Zamonaviy brauzerdan foydalaning."}
 finally{$("lb").disabled=false;$("lb").textContent="Davom etish"}
});

/* 2. kamera. MyID integratsiyasi yo'q: faqat kamera ruxsati va animatsiya */
function stop(){if(st){st.getTracks().forEach(t=>t.stop());st=null}$("vd").srcObject=null}
function face(done,title,from,ok){cb=done;back=from;okm=ok;$("fh").textContent=title;show("v2");start()}
async function start(){
 var c=$("cam"),s=$("fs");c.className="cam";["fr","fk"].forEach(x=>$(x).classList.add("hid"));s.textContent="Kameraga ruxsat bering";
 try{
  st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
  $("vd").srcObject=st;await $("vd").play();c.classList.add("scan");s.textContent="Skanerlanmoqda...";
  setTimeout(()=>{c.className="cam ok";s.innerHTML="<span style='color:var(--ok)'>&#10003; "+okm+"</span>";stop();setTimeout(cb,800)},2800);
 }catch(x){s.textContent="Kameraga ruxsat berilmadi yoki kamera topilmadi.";$("fr").classList.remove("hid");$("fk").classList.remove("hid")}
}
$("fr").onclick=start;$("fk").onclick=()=>{stop();cb()};$("fc").onclick=()=>{stop();show(back)};

/* 3. kirish tugadi: talaba ma'lumotini shu brauzer oynasida (sessionStorage) saqlab, Asosiy sahifaga o'tamiz.
   Serverga hech narsa yuborilmaydi; oyna yopilsa o'chadi. */
function enter(){
 try{sessionStorage.setItem(KEY,JSON.stringify(U))}
 catch(x){show("v1");$("le").textContent="Brauzer ma'lumotni saqlay olmadi. Maxfiy rejimni o'chirib ko'ring.";return}
 location.replace(HOME);
}
