<script>try{var t=localStorage.getItem("hemis_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#F2F5FA;--sf:#fff;--ink:#1B365D;--mut:#667791;--ln:#DDE4EE;--p:#1B365D;--on:#fff;--b2:#5B8FD0;--ok:#22A06B;--wn:#F59E0B;--er:#E5484D;--bl:#3B82F6;--vi:#7C5CD6;--dot:rgba(27,54,93,.13);--blob1:rgba(91,143,208,.34);--blob2:rgba(124,92,214,.16);--sh:0 1px 2px rgba(27,54,93,.05),0 12px 30px rgba(27,54,93,.07);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1220;--sf:#131C2E;--ink:#EAF0FA;--mut:#8DA0BD;--ln:#243350;--p:#5B8FD0;--on:#07101F;--dot:rgba(141,160,189,.16);--blob1:rgba(59,130,246,.22);--blob2:rgba(124,92,214,.22);--sh:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0B1220;--sf:#131C2E;--ink:#EAF0FA;--mut:#8DA0BD;--ln:#243350;--p:#5B8FD0;--on:#07101F;--dot:rgba(141,160,189,.16);--blob1:rgba(59,130,246,.22);--blob2:rgba(124,92,214,.22);--sh:none;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 Manrope,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
a,button,input,select{font:inherit;color:inherit}
.hid{display:none!important}
:focus-visible{outline:3px solid var(--b2);outline-offset:2px}
.mut{color:var(--mut);font-size:13px}
h1{font-size:25px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
h2{font-size:17px;font-weight:800;letter-spacing:-.01em}

/* ===== kod bilan chizilgan fon ===== */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg:before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.5px);background-size:24px 24px;-webkit-mask-image:linear-gradient(#000 0,transparent 62%);mask-image:linear-gradient(#000 0,transparent 62%)}
.bg i{position:absolute;border-radius:50%;filter:blur(64px)}
.bg .b1{width:360px;height:360px;right:-120px;top:-110px;background:var(--blob1);animation:drift 22s ease-in-out infinite alternate}
.bg .b2{width:300px;height:300px;left:-130px;top:46%;background:var(--blob2);animation:drift 28s ease-in-out infinite alternate-reverse}
.bg svg{position:absolute;right:-150px;top:-150px;width:420px;height:420px;color:var(--b2);opacity:.35;animation:spin 140s linear infinite}
@keyframes drift{to{transform:translate(-40px,50px) scale(1.12)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== sahifa ===== */
main{max-width:720px;margin:0 auto;padding:18px 16px 118px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tr{display:flex;gap:8px;align-items:center}
.ib,.xb{min-height:48px;border:1px solid var(--ln);background:var(--sf);border-radius:14px;cursor:pointer;font-weight:700;transition:transform .15s}
.ib{width:48px;display:grid;place-items:center}.xb{padding:0 16px}
.ib:active,.xb:active{transform:scale(.96)}
.ib svg{width:22px;height:22px}

/* ===== katta element: umumiy balans ===== */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px;color:#fff;min-height:208px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#2A2170 0%,#5B3FB8 58%,#7C5CD6 135%);--mx:70%;--my:0%;box-shadow:0 18px 40px rgba(76,52,160,.32)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.22),transparent 52%),repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 1px,transparent 1px 16px)}
.hero>*{position:relative}
.hero .art{position:absolute;right:-8px;top:-6px;width:230px;height:154px;pointer-events:none}
.hero small{display:block;font-size:13px;font-weight:700;opacity:.85;max-width:52%}
.hero .bal{display:block;font-size:clamp(30px,8.4vw,44px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:auto;padding-top:56px}
.hero .bal em{font-style:normal;font-size:.46em;font-weight:700;letter-spacing:0;opacity:.8;margin-left:6px}
.hero .hl{display:block;margin-top:auto;padding-top:58px;font-size:clamp(21px,6vw,28px);font-weight:800;letter-spacing:-.025em;line-height:1.15;overflow-wrap:anywhere}
.hero .hs{display:block;font-size:13px;font-weight:700;opacity:.88;margin-top:4px;letter-spacing:.02em}
.hero .low{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:14px}
.hero .chs{display:flex;gap:6px;flex-wrap:wrap}
.hero .chs span{font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3)}
.hero .qc{background:#fff;border-radius:14px;padding:7px;width:92px;height:92px;flex:none;box-shadow:0 8px 20px rgba(0,0,0,.25)}.hero .qc svg{width:100%;height:100%;display:block}
.hero .dots{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700;opacity:.92;flex-wrap:wrap}
.hero .dots span{display:inline-flex;align-items:center;gap:5px}
.hero .dots i{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1.5px rgba(255,255,255,.6)}
.glass{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:14px;cursor:pointer;font-weight:800;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .15s,background .2s}
.glass:hover{background:rgba(255,255,255,.28)}.glass:active{transform:scale(.97)}
.glass svg{width:20px;height:20px}
.art .spin{transform-origin:150px 62px;transform-box:view-box;animation:spin 40s linear infinite}
.art .f1,.art .f2,.art .f3{animation:float 6s ease-in-out infinite}
.art .f2{animation-duration:7.5s;animation-delay:-2s}.art .f3{animation-duration:5s;animation-delay:-1s}
@keyframes float{50%{transform:translateY(-9px)}}

/* ===== bo'limlar ===== */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 10px}
.sec .mut{font-weight:700}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px;box-shadow:var(--sh)}
.tag{font-size:12px;font-weight:800;padding:5px 11px;border-radius:20px;white-space:nowrap;flex:none}
.tag.ok{background:rgba(34,160,107,.16);color:var(--ok)}.tag.no{background:rgba(229,72,77,.14);color:var(--er)}
.tag.bl{background:rgba(59,130,246,.16);color:var(--bl)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--ln)}
.kv:last-child{border:0}.kv span{color:var(--mut)}.kv b{text-align:right}
.kv.fl{animation:flash 1.5s ease-out}
@keyframes flash{0%,35%{background:rgba(34,160,107,.22)}100%{background:transparent}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:14px;background:var(--p);color:var(--on);font-weight:700;cursor:pointer;padding:12px;transition:transform .15s}
.btn.s{background:var(--sf);color:var(--ink);border:1px solid var(--ln)}.btn:active{transform:scale(.98)}
.btn+.btn{margin-top:10px}.acts .btn+.btn{margin-top:0}
.pg{height:10px;border-radius:8px;background:var(--ln);overflow:hidden;margin:8px 0 6px}
.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#6FD3A6);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.prow{display:flex;justify-content:space-between;align-items:center}
.sv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:118px;padding:15px;border-radius:20px;border:1px solid var(--ln);background:var(--sf);cursor:pointer;text-align:left;box-shadow:var(--sh);transition:transform .15s,border-color .2s;--a:var(--bl)}
.tile:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--a) 22%,transparent),transparent 62%)}
.tile:active{transform:scale(.97)}.tile:hover{border-color:color-mix(in srgb,var(--a) 55%,var(--ln))}
.tile>*{position:relative}
.tile .ic{position:absolute;left:15px;top:15px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--a);color:#fff;box-shadow:0 8px 18px color-mix(in srgb,var(--a) 40%,transparent)}
.tile .ic svg{width:24px;height:24px}

.tile span{color:var(--mut);font-size:13px}
.note{margin:16px 4px 0;font-size:12.5px;color:var(--mut)}

/* ===== forma oynasi va kamera oynasi ===== */
label{display:block;font-weight:700;margin:16px 0 6px}
input,select{width:100%;min-height:50px;padding:0 14px;border:2px solid var(--ln);border-radius:12px;background:var(--sf)}

.err{color:var(--er);min-height:22px;margin-top:10px;text-align:center;font-weight:600}

.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}

.fo{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0)) 20px calc(20px + env(safe-area-inset-bottom,0));text-align:center}
.fo .box{width:100%;max-width:400px}
.fo h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.fo p.mut{margin-top:8px}
.rz{margin:20px 0 6px;padding:14px 16px;border:1px solid var(--ln);border-radius:16px;background:var(--sf);text-align:left;font-size:14px}
.rz li{margin:6px 0 6px 18px}
.fs{min-height:24px;margin:6px 0 14px;font-weight:700}
.cam{width:260px;height:260px;border-radius:28px;margin:24px auto 16px;overflow:hidden;position:relative;border:4px solid var(--ln);background:#0B1220;transition:border-color .3s}
.cam video{width:100%;height:100%;object-fit:cover}
.cam.scan{border-color:var(--wn)}.cam.ok{border-color:var(--ok)}
.cam i{position:absolute;left:0;right:0;height:3px;background:var(--ok);box-shadow:0 0 14px var(--ok);top:0;display:none}
.cam.scan i{display:block;animation:sc 1.1s ease-in-out infinite alternate}
@keyframes sc{to{top:calc(100% - 3px)}}

/* ===== pastki navigatsiya ===== */
.nv{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--sf) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0))}
.nv a{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;text-decoration:none;color:var(--mut);font-weight:700;font-size:11px;transition:background .2s,color .2s}
.nv a svg{width:23px;height:23px}
.nv a[aria-current]{color:var(--p);background:color-mix(in srgb,var(--p) 14%,transparent)}
.nv a[aria-current] svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6)}}
@media(min-width:700px){.nv{left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:720px;border:1px solid var(--ln);border-bottom:0;border-radius:20px 20px 0 0}}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:90%;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== sahifa ochilishi ===== */
.rise{opacity:0;transform:translateY(16px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*90ms)}
@keyframes rise{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important}
 .rise{opacity:1;transform:none}
 .cam.scan i{top:50%}
}

.st{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:14px 8px}
.st b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.rk{display:grid;gap:16px;padding:4px 0}
.rk .r{display:grid;grid-template-columns:1fr auto;gap:7px 10px;align-items:baseline}
.rk .r b{font-size:15px}.rk .r em{font-style:normal;color:var(--mut);font-size:12px;font-weight:700;margin-left:6px}
.rk .bar{grid-column:1/-1;height:8px;border-radius:8px;background:var(--ln);overflow:hidden}
.rk .bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--vi),var(--b2));transition:width 1s cubic-bezier(.2,.7,.2,1)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border-radius:16px;background:var(--bg);border:1px solid var(--ln)}
.seg button{min-height:48px;border:0;border-radius:12px;background:transparent;cursor:pointer;font-weight:700;color:var(--mut);transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--sf);color:var(--ink);box-shadow:0 2px 8px rgba(27,54,93,.14)}
.desc{margin-bottom:12px}
</style></head><body>

 <section class="hero rise" style="--i:1" id="hr" aria-label="Talaba kartasi">${ART}
  <small>Talaba kartasi · namuna</small>
  <span class="hl">${esc(nm)}</span><span class="hs">ID ${esc(U.id)}</span>
  <div class="low"><div class="chs"><span>${GROUP}</span><span>${KURS}-kurs</span><span>${SEMN}-semestr</span></div><div class="qc" id="qc"></div></div>
 </section>

 <div class="sec rise" style="--i:2"><h2>Ta'lim ma'lumotlari</h2></div>
 <div class="card rise" style="--i:2">
  <div class="kv"><span>F.I.SH.</span><b>${esc(nm)}</b></div><div class="kv"><span>ID</span><b>${esc(U.id)}</b></div>
  <div class="kv"><span>Universitet</span><b>${UNI}</b></div><div class="kv"><span>Guruh</span><b>${GROUP}</b></div>
  <div class="kv"><span>Kurs / semestr</span><b>${KURS}-kurs · ${SEMN}-semestr</b></div><div class="kv"><span>Ta'lim shakli</span><b>${FORM}</b></div>
 </div>

 <div class="sec rise" style="--i:3"><h2>O'zlashtirish</h2><span class="mut">Namuna</span></div>
 <div class="card st rise" style="--i:3"><div><b>${U.gpa}</b><span class="mut">GPA / 5</span></div><div><b>${KREDIT}</b><span class="mut">Kredit</span></div><div><b>${QARZ}</b><span class="mut">Qarz</span></div></div>

 <div class="sec rise" style="--i:4"><h2>GPA reytingi</h2><span class="mut">Namuna</span></div>
 <div class="card rise" style="--i:4"><div class="rk" id="rk">${SC.map(s=>`<div class="r"><span>${s[0]}</span><b>${fmtn(s[2])}<em>/ ${fmtn(s[1])}</em></b><div class="bar" role="img" aria-label="${s[0]} bo'yicha ${s[2]}-o'rin, jami ${s[1]}"><i data-w="${Math.max(4,Math.round((1-(s[2]-1)/s[1])*100))}"></i></div></div>`).join("")}</div>
  <p class="mut" style="margin-top:12px">Faqat o'zingizning o'rningiz ko'rsatiladi. Haqiqiy reyting HEMIS ulangach olinadi.</p></div>

 <div class="sec rise" style="--i:5"><h2>Rezyume (CV)</h2></div>
 <div class="card rise" style="--i:5"><p class="mut desc">Ta'lim ma'lumotlaringiz rezyume shaklida avtomatik tayyorlanadi. Ko'rib chiqing va faylni yuklab oling.</p><button class="btn" id="cv">Rezyumeni ko'rish</button></div>

 <div class="sec rise" style="--i:6"><h2>Xavfsizlik</h2></div>
 <div class="card rise" style="--i:6">
  <div class="kv"><span>Kirish usuli</span><b>ID va yuz skaneri</b></div>
  <div class="kv"><span>Yuz rasmi</span><b>Saqlanmaydi</b></div>
  <div class="kv"><span>Seans</span><b>Faqat shu brauzer oynasi</b></div>
  <p class="mut" style="margin-top:10px">Bu prototip: parol yo'q, yuz haqiqatda solishtirilmaydi (MyID ulanmagan). Haqiqiy tizimda parolni tiklash Registrator ofisi orqali bo'ladi.</p></div>

 <div class="sec rise" style="--i:7"><h2>Sozlamalar</h2></div>
 <div class="card rise" style="--i:7"><label class="mut" style="display:block;font-weight:700;margin-bottom:8px">Ko'rinish</label>
  <div class="seg" id="sg" role="group" aria-label="Ko'rinish rejimi"><button data-t="auto">Avto</button><button data-t="light">Kunduzgi</button><button data-t="dark">Tungi</button></div>
  <button class="btn s" style="margin-top:14px" id="ex2">Hisobdan chiqish</button></div>
 <p class="note rise" style="--i:8">GPA, kredit, qarz, reyting o'rinlari va guruhlar soni namuna (demo) ma'lumotlar. Fakultet, yo'nalish va shaxsiy hujjat ma'lumotlari hali kiritilmagan.</p>`;
 qr($("qc"),U.s||7);
 $("th").onclick=()=>theme();$("ex").onclick=out;$("ex2").onclick=out;setIcon();segSync();
 $("sg").onclick=e=>{var b=e.target.closest&&e.target.closest("[data-t]");if(b)setTheme(b.dataset.t)};
 $("cv").onclick=cvSheet;
 var h=$("hr");if(matchMedia("(hover:hover)").matches&&!reduced())h.addEventListener("pointermove",e=>{var r=h.getBoundingClientRect();h.style.setProperty("--mx",((e.clientX-r.left)/r.width*100)+"%");h.style.setProperty("--my",((e.clientY-r.top)/r.height*100)+"%")});
 /* reyting chiziqlari sahifa ochilgach to'ladi */
 setTimeout(()=>{[].forEach.call(document.querySelectorAll("#rk .bar i"),i=>{i.style.width=i.dataset.w+"%"})},reduced()?0:600);
}

/* ===== rezyume: oyna va yuklab olish ===== */
var shOp=null;
function cvSheet(){shOp=$("cv");
 $("sh").innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-labelledby="sht"><div class="hd"><h2 id="sht">Rezyume (CV)</h2><button class="ib" id="sx" aria-label="Yopish">✕</button></div>
  <div style="margin-top:8px"><div class="kv"><span>F.I.SH.</span><b>${esc(U.name)}</b></div><div class="kv"><span>ID</span><b>${esc(U.id)}</b></div><div class="kv"><span>Universitet</span><b>${UNI}</b></div><div class="kv"><span>Guruh</span><b>${GROUP}</b></div><div class="kv"><span>Kurs / semestr</span><b>${KURS}-kurs · ${SEMN}-semestr</b></div><div class="kv"><span>Ta'lim shakli</span><b>${FORM}</b></div><div class="kv"><span>GPA (namuna)</span><b>${U.gpa} / 5</b></div></div>
  <p class="mut" style="margin-top:10px">Fayl brauzerda ochiladi, uni bosma qilish yoki PDF sifatida saqlash mumkin.</p>
  <button class="btn" style="margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px" id="sg2"><span style="width:20px;height:20px;display:inline-block">${svg("dl")}</span>Yuklab olish</button></div>`;
 $("sh").classList.remove("hid");document.body.style.overflow="hidden";
 $("sx").onclick=shut;$("sg2").onclick=cvDownload;$("sh").onclick=e=>{if(e.target===$("sh"))shut()};$("sg2").focus()}
function shut(){$("sh").classList.add("hid");$("sh").innerHTML="";document.body.style.overflow="";if(shOp&&shOp.focus)shOp.focus()}
function cvDownload(){
 var d='<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rezyume: '+esc(U.name)+'</title><style>body{font:16px/1.55 system-ui,Arial,sans-serif;max-width:680px;margin:40px auto;padding:0 20px;color:#1B365D}h1{margin:0 0 4px;font-size:30px}h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid #5B8FD0;padding-bottom:4px;margin-top:28px}td{padding:6px 14px 6px 0;vertical-align:top}td:first-child{color:#667791}small{color:#667791}</style></head><body>'
 +'<h1>'+esc(U.name)+'</h1><div>Talaba, ID '+esc(U.id)+'</div><h2>Ta\'lim</h2><table><tr><td>Universitet</td><td>'+UNI+'</td></tr><tr><td>Guruh</td><td>'+GROUP+'</td></tr><tr><td>Kurs / semestr</td><td>'+KURS+'-kurs, '+SEMN+'-semestr</td></tr><tr><td>Ta\'lim shakli</td><td>'+FORM+'</td></tr><tr><td>GPA</td><td>'+U.gpa+' / 5 (namuna)</td></tr></table>'
 +'<p><small>HEMIS 3.0 prototipidan olingan namuna rezyume. Rasmiy hujjat emas.</small></p></body></html>';
 try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([d],{type:"text/html;charset=utf-8"}));a.download="rezyume-"+U.id+".html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("Rezyume yuklab olindi")}
 catch(x){toast("Brauzer faylni yuklay olmadi")}}
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&!$("sh").classList.contains("hid"))shut()});

/* ===== ko'rinish rejimi (Avto / Kunduzgi / Tungi), chiqish, navigatsiya ===== */
function isDark(){var r=document.documentElement;return r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function setIcon(){$("th").innerHTML=svg(isDark()?"su":"mo")}
function segSync(){var v="auto";try{v=localStorage.getItem("hemis_theme")||"auto"}catch(x){}if(v!="light"&&v!="dark")v="auto";[].forEach.call($("sg").children,b=>b.setAttribute("aria-pressed",b.dataset.t==v))}
function setTheme(v){var r=document.documentElement;
 if(v=="auto"){delete r.dataset.theme;try{localStorage.removeItem("hemis_theme")}catch(x){}}
 else{r.dataset.theme=v;try{localStorage.setItem("hemis_theme",v)}catch(x){}}
 setIcon();segSync()}
function theme(){setTheme(isDark()?"light":"dark")}
function out(){try{["hemis_talaba","hemis_m","hemis_scn","hemis_ts","hemis_perm"].forEach(k=>sessionStorage.removeItem(k))}catch(x){}location.replace("/talaba/")}
var T=[["Asosiy","/talaba/asosiy/","ho"],["Ta'lim","/talaba/talim/","ta"],["Jadval","/talaba/jadval/","ja"],["Hamyon","/talaba/hamyon/","ha"],["Shaxsiy","/talaba/shaxsiy/","sh"]];
$("nv").innerHTML=T.map((t,i)=>`<a href="${t[1]}"${i==4?' aria-current="page"':""}>${svg(t[2],1.8)}${t[0]}</a>`).join("");
build();
}
</script></body></html>
