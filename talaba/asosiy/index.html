<style>
:root{--bg:#F2F5FA;--sf:#fff;--ink:#1B365D;--mut:#667791;--ln:#DDE4EE;--p:#1B365D;--on:#fff;--b2:#5B8FD0;--ok:#22A06B;--wn:#F59E0B;--er:#E5484D;--bl:#3B82F6;--vi:#7C5CD6;--dot:rgba(27,54,93,.13);--blob1:rgba(91,143,208,.34);--blob2:rgba(124,92,214,.16);--sh:0 1px 2px rgba(27,54,93,.05),0 12px 30px rgba(27,54,93,.07);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1220;--sf:#131C2E;--ink:#EAF0FA;--mut:#8DA0BD;--ln:#243350;--p:#5B8FD0;--on:#07101F;--dot:rgba(141,160,189,.16);--blob1:rgba(59,130,246,.22);--blob2:rgba(124,92,214,.22);--sh:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0B1220;--sf:#131C2E;--ink:#EAF0FA;--mut:#8DA0BD;--ln:#243350;--p:#5B8FD0;--on:#07101F;--dot:rgba(141,160,189,.16);--blob1:rgba(59,130,246,.22);--blob2:rgba(124,92,214,.22);--sh:none;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 Manrope,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
a,button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--b2);outline-offset:2px}
.mut{color:var(--mut);font-size:13px}
h1{font-size:25px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
h2{font-size:17px;font-weight:800;letter-spacing:-.01em}

/* ===== kod bilan chizilgan fon ===== */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg:before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.5px);background-size:24px 24px;-webkit-mask-image:linear-gradient(#000 0,transparent 62%);mask-image:linear-gradient(#000 0,transparent 62%)}
.bg i{position:absolute;border-radius:50%;filter:blur(64px)}
.bg .b1{width:360px;height:360px;right:-120px;top:-110px;background:var(--blob1);animation:drift 22s ease-in-out infinite alternate}
.bg .b2{width:300px;height:300px;left:-130px;top:46%;background:var(--blob2);animation:drift 28s ease-in-out infinite alternate-reverse}
.bg svg{position:absolute;right:-150px;top:-150px;width:420px;height:420px;color:var(--b2);opacity:.35;animation:spin 140s linear infinite}
@keyframes drift{to{transform:translate(-40px,50px) scale(1.12)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== sahifa ===== */
main{max-width:720px;margin:0 auto;padding:18px 16px 118px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.ava{width:52px;height:52px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--b2),var(--vi),var(--ok));flex:none}
.ava span{width:100%;height:100%;border-radius:50%;background:var(--sf);display:grid;place-items:center;font-weight:800;color:var(--ink);font-size:16px}
.chips{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.chips span{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:color-mix(in srgb,var(--b2) 16%,transparent);color:var(--ink)}
.tr{display:flex;gap:8px;align-items:center}
.ib,.xb{min-height:48px;border:1px solid var(--ln);background:var(--sf);border-radius:14px;cursor:pointer;font-weight:700;transition:transform .15s}
.ib{width:48px;display:grid;place-items:center}.xb{padding:0 16px}
.ib:active,.xb:active{transform:scale(.96)}
.ib svg{width:22px;height:22px}

/* ===== balans kartasi (asosiy ko'rinish) ===== */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px;color:#fff;min-height:208px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#16305A 0%,#2C5A96 58%,#3B82F6 135%);--mx:70%;--my:0%;box-shadow:0 18px 40px rgba(27,54,93,.28)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.22),transparent 52%),repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 1px,transparent 1px 16px)}
.hero>*{position:relative}
.hero .art{position:absolute;right:-8px;top:-6px;width:230px;height:154px;pointer-events:none}
.hero small{display:block;font-size:13px;font-weight:700;opacity:.82;max-width:52%}
.hero .bal{display:block;font-size:clamp(30px,8.4vw,44px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:auto;padding-top:56px}
.hero .bal em{font-style:normal;font-size:.46em;font-weight:700;letter-spacing:0;opacity:.8;margin-left:6px}
.hero .low{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.hero .dots{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:700;opacity:.9}
.hero .dots i{width:10px;height:10px;border-radius:50%;display:inline-block}
.glass{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:14px;text-decoration:none;font-weight:800;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .15s,background .2s}
.glass:hover{background:rgba(255,255,255,.28)}.glass:active{transform:scale(.97)}
.art .spin{transform-origin:150px 62px;transform-box:view-box;animation:spin 40s linear infinite}
.art .f1,.art .f2,.art .f3{animation:float 6s ease-in-out infinite}
.art .f2{animation-duration:7.5s;animation-delay:-2s}.art .f3{animation-duration:5s;animation-delay:-1s}
@keyframes float{50%{transform:translateY(-9px)}}

/* ===== tugmalar ===== */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:132px;padding:15px;border-radius:20px;border:1px solid var(--ln);background:var(--sf);text-decoration:none;box-shadow:var(--sh);transition:transform .15s,border-color .2s;--a:var(--bl)}
.tile:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--a) 22%,transparent),transparent 62%)}
.tile:active{transform:scale(.97)}
.tile:hover{border-color:color-mix(in srgb,var(--a) 55%,var(--ln))}
.tile>*{position:relative}
.tile .ic{position:absolute;left:15px;top:15px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--a);color:#fff;box-shadow:0 8px 18px color-mix(in srgb,var(--a) 40%,transparent)}
.tile .ic svg{width:24px;height:24px}
.tile .ta{position:absolute;right:-12px;top:-12px;width:104px;height:104px;color:var(--a);opacity:.55}
.tile b{display:block;font-size:19px;font-weight:800;letter-spacing:-.015em}
.tile span{color:var(--mut);font-size:13px}

/* ===== bugungi darslar ===== */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 10px}
.sec .mut{font-weight:700}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:8px 16px;box-shadow:var(--sh)}
.ls{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln);position:relative}
.ls:last-child{border:0}
.ls:before{content:"";width:4px;align-self:stretch;border-radius:4px;background:var(--bl);flex:none}
.ls.ok:before{background:var(--ok)}.ls.no:before{background:var(--er)}
.ls .tm{width:48px;flex:none;line-height:1.25}.ls .tm b{display:block;font-size:14px}.ls .tm span{font-size:12px;color:var(--mut);font-weight:700}
.ls .g{flex:1;min-width:0}.ls .g b{display:block;font-size:15px;line-height:1.3}
.pgb{height:5px;border-radius:5px;background:var(--ln);margin-top:8px;overflow:hidden}
.pgb i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--bl),var(--b2));transition:width 1s linear}
.tag{font-size:12px;font-weight:800;padding:5px 11px;border-radius:20px;white-space:nowrap;flex:none}
.tag.ok{background:rgba(34,160,107,.16);color:var(--ok)}.tag.no{background:rgba(229,72,77,.14);color:var(--er)}
.tag.bl{background:rgba(59,130,246,.16);color:var(--bl)}
.tag .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bl);margin-right:6px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.7);opacity:.35}}
.empty{display:flex;align-items:center;gap:14px;padding:16px 0}
.empty svg{width:56px;height:56px;flex:none}
.note{margin:16px 4px 0;font-size:12.5px;color:var(--mut)}

/* ===== pastki navigatsiya ===== */
.nv{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--sf) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0))}
.nv a{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;text-decoration:none;color:var(--mut);font-weight:700;font-size:11px;transition:background .2s,color .2s}
.nv a svg{width:23px;height:23px}
.nv a[aria-current]{color:var(--p);background:color-mix(in srgb,var(--p) 14%,transparent)}
.nv a[aria-current] svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6)}}
@media(min-width:700px){.nv{left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:720px;border:1px solid var(--ln);border-bottom:0;border-radius:20px 20px 0 0}}

/* ===== sahifa ochilishi: bitta tartibli ketma-ketlik ===== */
.rise{opacity:0;transform:translateY(16px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*90ms)}
@keyframes rise{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important}
 .rise{opacity:1;transform:none}
}
</style></head><body>

 return L.map((l,i)=>{var s=status(n,i,l),a=mm(l[0]),b=mm(l[1]),p=m>=a&&m<b?Math.max(3,Math.round((m-a)/(b-a)*100)):0;
  return`<div class="ls ${s}"><div class="tm"><b>${l[0]}</b><span>${l[1]}</span></div><div class="g"><b>${esc(l[2])}</b><span class="mut">${esc(l[3])}, ${esc(l[4])}</span>${p?`<div class="pgb"><i style="width:${p}%"></i></div>`:""}</div>${TG[s]}</div>`}).join("")}

function page(){var n=new Date(),L=S[n.getDay()]||[],nm=cap(U.name.split(" ")[1]||U.name);
 $("m").innerHTML=`
 <header class="top rise" style="--i:0"><div class="who"><div class="ava"><span>${esc(ini())}</span></div><div style="min-width:0"><h1>Salom, ${esc(nm)}</h1><div class="chips"><span>ST-50/24</span><span>5-semestr</span></div></div></div>
  <div class="tr"><button class="ib" id="th" aria-label="Tungi va kunduzgi rejim">${svg("mo")}</button><button class="xb" id="ex">Chiqish</button></div></header>

 <section class="hero rise" style="--i:1" id="hr" aria-label="Umumiy balans">${ART}
  <small>Umumiy balans, ${M.cards.length} ta karta</small>
  <span class="bal" id="bal" aria-label="${fmt(tot())} so'm">0<em>so'm</em></span>
  <div class="low"><div class="dots">${M.cards.map(c=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:6px"><i style="background:${c.c}"></i>${c.n}</span>`).join("")}</div><a class="glass" href="/talaba/hamyon/">Hamyon</a></div>
 </section>

 <div class="tiles">
  <a class="tile rise" style="--i:2;--a:#3B82F6" href="/talaba/jadval/"><div class="ic">${svg("da")}</div>${ta("da")}<b>Davomat</b><span>FACE va jadval</span></a>
  <a class="tile rise" style="--i:3;--a:#22A06B" href="/talaba/hamyon/"><div class="ic">${svg("ka")}</div>${ta("ka")}<b>Kartalar</b><span>Balans, o'tkazma</span></a>
  <a class="tile rise" style="--i:4;--a:#F59E0B" href="/talaba/hamyon/#transport"><div class="ic">${svg("tr")}</div>${ta("tr")}<b>Transport</b><span>Metro va avtobus</span></a>
  <a class="tile rise" style="--i:5;--a:#7C5CD6" href="/talaba/shaxsiy/"><div class="ic">${svg("sh")}</div>${ta("sh")}<b>Shaxsiy</b><span>Ma'lumotlar</span></a>
 </div>

 <div class="sec rise" style="--i:6"><h2>Bugungi darslar</h2><span class="mut">${DN[n.getDay()]}, ${n.getDate()}-${MN[n.getMonth()]}</span></div>
 <div class="card rise" style="--i:6" id="ls">${lessons()}</div>
 <p class="note rise" style="--i:7">Kartalar balansi va davomat holati namuna (demo) ma'lumotlar.</p>`;
 count();
 $("th").onclick=theme;$("ex").onclick=out;
 var h=$("hr");if(matchMedia("(hover:hover)").matches&&!matchMedia("(prefers-reduced-motion:reduce)").matches)h.addEventListener("pointermove",e=>{var r=h.getBoundingClientRect();h.style.setProperty("--mx",((e.clientX-r.left)/r.width*100)+"%");h.style.setProperty("--my",((e.clientY-r.top)/r.height*100)+"%")});
 setIcon()}

/* balans raqamlari sanab chiqiladi (harakat sozlamasi o'chiq bo'lsa darhol ko'rsatiladi) */
function count(){var el=$("bal"),to=tot(),put=v=>{el.innerHTML=fmt(v)+"<em>so'm</em>"};
 if(matchMedia("(prefers-reduced-motion:reduce)").matches){put(to);return}
 var t0=null,dur=1300;function f(t){if(t0===null)t0=t;var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);put(Math.round(to*e));if(k<1)requestAnimationFrame(f)}
 setTimeout(()=>requestAnimationFrame(f),350)}

/* tungi rejim, chiqish */
function isDark(){var r=document.documentElement;return r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function setIcon(){$("th").innerHTML=svg(isDark()?"su":"mo")}
function theme(){var r=document.documentElement,v=isDark()?"light":"dark";r.dataset.theme=v;try{localStorage.setItem("hemis_theme",v)}catch(x){}setIcon()}
function out(){try{["hemis_talaba","hemis_m","hemis_scn"].forEach(k=>sessionStorage.removeItem(k))}catch(x){}location.replace("/talaba/")}

/* pastki navigatsiya: har bo'lim alohida sahifa */
var T=[["Asosiy","/talaba/asosiy/","ho"],["Ta'lim","/talaba/talim/","ta"],["Jadval","/talaba/jadval/","ja"],["Hamyon","/talaba/hamyon/","ha"],["Shaxsiy","/talaba/shaxsiy/","sh"]];
$("nv").innerHTML=T.map((t,i)=>`<a href="${t[1]}"${i==0?' aria-current="page"':""}>${svg(t[2],1.8)}${t[0]}</a>`).join("");

page();
setInterval(()=>{$("ls").innerHTML=lessons()},60000);
}
</script></body></html>
