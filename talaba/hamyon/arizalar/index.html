<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arizalar | HEMIS 3.0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("hemis_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#F2F5FA;--sf:#fff;--ink:#1B365D;--mut:#667791;--ln:#DDE4EE;--p:#1B365D;--on:#fff;--b2:#5B8FD0;--ok:#22A06B;--wn:#F59E0B;--er:#E5484D;--bl:#3B82F6;--vi:#7C5CD6;--dot:rgba(27,54,93,.13);--blob1:rgba(91,143,208,.34);--blob2:rgba(124,92,214,.16);--sh:0 1px 2px rgba(27,54,93,.05),0 12px 30px rgba(27,54,93,.07);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1220;--sf:#131C2E;--ink:#EAF0FA;--mut:#8DA0BD;--ln:#243350;--p:#5B8FD0;--on:#07101F;--dot:rgba(141,160,189,.16);--blob1:rgba(59,130,246,.22);--blob2:rgba(124,92,214,.22);--sh:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0B1220;--sf:#131C2E;--ink:#EAF0FA;--mut:#8DA0BD;--ln:#243350;--p:#5B8FD0;--on:#07101F;--dot:rgba(141,160,189,.16);--blob1:rgba(59,130,246,.22);--blob2:rgba(124,92,214,.22);--sh:none;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 Manrope,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
a,button,input,select{font:inherit;color:inherit}
.hid{display:none!important}
:focus-visible{outline:3px solid var(--b2);outline-offset:2px}
.mut{color:var(--mut);font-size:13px}
h1{font-size:25px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
h2{font-size:17px;font-weight:800;letter-spacing:-.01em}

/* ===== kod bilan chizilgan fon ===== */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg:before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.5px);background-size:24px 24px;-webkit-mask-image:linear-gradient(#000 0,transparent 62%);mask-image:linear-gradient(#000 0,transparent 62%)}
.bg i{position:absolute;border-radius:50%;filter:blur(64px)}
.bg .b1{width:360px;height:360px;right:-120px;top:-110px;background:var(--blob1);animation:drift 22s ease-in-out infinite alternate}
.bg .b2{width:300px;height:300px;left:-130px;top:46%;background:var(--blob2);animation:drift 28s ease-in-out infinite alternate-reverse}
.bg svg{position:absolute;right:-150px;top:-150px;width:420px;height:420px;color:var(--b2);opacity:.35;animation:spin 140s linear infinite}
@keyframes drift{to{transform:translate(-40px,50px) scale(1.12)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== sahifa ===== */
main{max-width:720px;margin:0 auto;padding:18px 16px 118px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tr{display:flex;gap:8px;align-items:center}
.ib,.xb{min-height:48px;border:1px solid var(--ln);background:var(--sf);border-radius:14px;cursor:pointer;font-weight:700;transition:transform .15s}
.ib{width:48px;display:grid;place-items:center}.xb{padding:0 16px}
.ib:active,.xb:active{transform:scale(.96)}
.ib svg{width:22px;height:22px}

/* ===== katta element: umumiy balans ===== */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px;color:#fff;min-height:208px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#0B4D3E 0%,#17805F 58%,#22A06B 135%);--mx:70%;--my:0%;box-shadow:0 18px 40px rgba(15,107,85,.3)}
.hero.g2{background:linear-gradient(135deg,#16305A 0%,#2C5A96 58%,#3B82F6 135%);box-shadow:0 18px 40px rgba(27,54,93,.28)}
.hero.g3{background:linear-gradient(135deg,#2B2370 0%,#5B3FB8 58%,#7C5CD6 135%);box-shadow:0 18px 40px rgba(76,52,160,.32)}
.hero.g4{background:linear-gradient(135deg,#0B3D4D 0%,#14748A 58%,#3B82F6 135%);box-shadow:0 18px 40px rgba(20,116,138,.3)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.22),transparent 52%),repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 1px,transparent 1px 16px)}
.hero>*{position:relative}
.hero .art{position:absolute;right:-8px;top:-6px;width:230px;height:154px;pointer-events:none}
.hero .low{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.glass{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:14px;cursor:pointer;font-weight:800;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .15s,background .2s}
.glass:hover{background:rgba(255,255,255,.28)}.glass:active{transform:scale(.97)}
.glass svg{width:20px;height:20px}
.art .spin{transform-origin:150px 62px;transform-box:view-box;animation:spin 40s linear infinite}
.art .f1,.art .f2,.art .f3{animation:float 6s ease-in-out infinite}
.art .f2{animation-duration:7.5s;animation-delay:-2s}.art .f3{animation-duration:5s;animation-delay:-1s}
@keyframes float{50%{transform:translateY(-9px)}}

/* ===== bo'limlar ===== */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 10px}
.sec .mut{font-weight:700}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px;box-shadow:var(--sh)}
.tag{font-size:12px;font-weight:800;padding:5px 11px;border-radius:20px;white-space:nowrap;flex:none}
.tag.ok{background:rgba(34,160,107,.16);color:var(--ok)}.tag.no{background:rgba(229,72,77,.14);color:var(--er)}
.tag.bl{background:rgba(59,130,246,.16);color:var(--bl)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--ln)}
.kv:last-child{border:0}.kv span{color:var(--mut)}.kv b{text-align:right}
.kv.fl{animation:flash 1.5s ease-out}
@keyframes flash{0%,35%{background:rgba(34,160,107,.22)}100%{background:transparent}}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:14px;background:var(--p);color:var(--on);font-weight:700;cursor:pointer;padding:12px;transition:transform .15s}
.btn.s{background:var(--sf);color:var(--ink);border:1px solid var(--ln)}.btn:active{transform:scale(.98)}
.btn+.btn{margin-top:10px}.pg{height:10px;border-radius:8px;background:var(--ln);overflow:hidden;margin:8px 0 6px}
.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#6FD3A6);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.prow{display:flex;justify-content:space-between;align-items:center}
.qb{background:#fff;border-radius:14px;padding:10px;width:180px;height:180px;margin:12px auto 6px}.qb svg{width:100%;height:100%;display:block}
.note{margin:16px 4px 0;font-size:12.5px;color:var(--mut)}

/* ===== forma oynasi va kamera oynasi ===== */
label{display:block;font-weight:700;margin:16px 0 6px}
input,select{width:100%;min-height:50px;padding:0 14px;border:2px solid var(--ln);border-radius:12px;background:var(--sf)}
input:focus,select:focus{border-color:var(--b2);outline:none}
.err{color:var(--er);min-height:22px;margin-top:10px;text-align:center;font-weight:600}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(5,10,20,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet .card{width:100%;max-width:460px;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0));max-height:92vh;overflow:auto}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media(min-width:600px){.sheet{align-items:center}.sheet .card{border-radius:24px}}
.fo{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0)) 20px calc(20px + env(safe-area-inset-bottom,0));text-align:center}
.fo .box{width:100%;max-width:400px}
.fo h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.fo p.mut{margin-top:8px}
.rz{margin:20px 0 6px;padding:14px 16px;border:1px solid var(--ln);border-radius:16px;background:var(--sf);text-align:left;font-size:14px}
.rz li{margin:6px 0 6px 18px}
.fs{min-height:24px;margin:6px 0 14px;font-weight:700}
.cam{width:260px;height:260px;border-radius:28px;margin:24px auto 16px;overflow:hidden;position:relative;border:4px solid var(--ln);background:#0B1220;transition:border-color .3s}
.cam video{width:100%;height:100%;object-fit:cover}
.cam.scan{border-color:var(--wn)}.cam.ok{border-color:var(--ok)}
.cam i{position:absolute;left:0;right:0;height:3px;background:var(--ok);box-shadow:0 0 14px var(--ok);top:0;display:none}
.cam.scan i{display:block;animation:sc 1.1s ease-in-out infinite alternate}
@keyframes sc{to{top:calc(100% - 3px)}}

/* ===== pastki navigatsiya ===== */
.nv{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--sf) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0))}
.nv a{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;text-decoration:none;color:var(--mut);font-weight:700;font-size:11px;transition:background .2s,color .2s}
.nv a svg{width:23px;height:23px}
.nv a[aria-current]{color:var(--p);background:color-mix(in srgb,var(--p) 14%,transparent)}
.nv a[aria-current] svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6)}}
@media(min-width:700px){.nv{left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:720px;border:1px solid var(--ln);border-bottom:0;border-radius:20px 20px 0 0}}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:90%;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== sahifa ochilishi ===== */
.rise{opacity:0;transform:translateY(16px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*90ms)}
@keyframes rise{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important}
 .rise{opacity:1;transform:none}
 .cam.scan i{top:50%}
}

.hero small{display:block;font-size:13px;font-weight:700;opacity:.88;max-width:52%}
.hero .hl{display:block;margin-top:auto;padding-top:58px;font-size:clamp(24px,7vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1.1;overflow-wrap:anywhere}
.hero .hl em{font-style:normal;font-size:.5em;font-weight:700;letter-spacing:0;opacity:.85;margin-left:6px}
.hero .sb{display:block;font-size:13px;font-weight:700;opacity:.9;margin-top:6px}
.hero .low{flex-wrap:wrap;justify-content:flex-start}
.top{flex-wrap:nowrap}.top>.tr:first-child{min-width:0}.top h1{font-size:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:400px){.top .xb{padding:0 12px}}
a.ib{text-decoration:none}
.ib,.xb{flex:none}
.top .tr:first-child>div{min-width:0;overflow:hidden}
.sec .mut a{color:inherit;text-decoration:none}
/* ===== kartalar ===== */
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 12px;scroll-padding:0 16px}
.cd{flex:0 0 min(264px,78%);scroll-snap-align:start;border-radius:20px;padding:16px;color:#fff;min-height:152px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.cd.full{flex:none;width:100%}.cd+.cd.full{margin-top:12px}
.cd:before{content:"";position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1)}
.cd>*{position:relative}
.cd .nm{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px}
.cd .nm span{font-size:12px;font-weight:700;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:20px}
.cd .no{font-size:19px;font-weight:800;letter-spacing:.1em}
.cd .cf{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:700;opacity:.88;margin-top:8px;padding-right:54px;min-height:18px}
.cd .rm{position:absolute;right:10px;bottom:10px;width:48px;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer}
.cd .rm svg{width:22px;height:22px}
.cd.flash{animation:cflash 1.4s ease-out}
@keyframes cflash{0%{transform:scale(.94);opacity:.4}60%{transform:scale(1.02)}}
.ad{flex:0 0 min(210px,62%);scroll-snap-align:start;min-height:152px;border:2px dashed var(--ln);border-radius:20px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;color:var(--mut);font-weight:800;cursor:pointer;padding:12px}
.ad:hover{border-color:var(--b2);color:var(--ink)}
.ad .pl{width:44px;height:44px;border-radius:14px;background:var(--p);color:var(--on);display:grid;place-items:center}.ad .pl svg{width:24px;height:24px}
.ad.full{flex:none;width:100%;min-height:120px}
/* ===== bo'lim havolalari va tanlov plitkalari ===== */
.lk{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;min-height:88px;padding:14px 16px;border-radius:20px;border:1px solid var(--ln);background:var(--sf);box-shadow:var(--sh);text-decoration:none;--a:var(--bl);transition:transform .15s,border-color .2s;color:inherit}
button.lk{width:100%;text-align:left;cursor:pointer}
.lk+.lk{margin-top:12px}
.lk:before,.big:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--a) 20%,transparent),transparent 62%)}
.lk>*,.big>*{position:relative}.lk:active,.big:active{transform:scale(.98)}.lk:hover,.big:hover{border-color:color-mix(in srgb,var(--a) 55%,var(--ln))}
.lk .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--a);color:#fff;flex:none;box-shadow:0 8px 18px color-mix(in srgb,var(--a) 40%,transparent)}
.lk .ic svg{width:25px;height:25px}
.lk .g{flex:1;min-width:0}.lk .g b{display:block;font-size:18px;font-weight:800;letter-spacing:-.015em}
.lk .ch{width:22px;height:22px;color:var(--mut);flex:none}
.cho{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:158px;padding:16px;border-radius:22px;border:1px solid var(--ln);background:var(--sf);cursor:pointer;text-align:left;box-shadow:var(--sh);transition:transform .15s,border-color .2s;--a:var(--bl);color:inherit}
.big .ic{position:absolute;left:16px;top:16px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--a);color:#fff;box-shadow:0 8px 18px color-mix(in srgb,var(--a) 40%,transparent)}
.big .ic svg{width:28px;height:28px}
.big b{display:block;font-size:20px;font-weight:800;letter-spacing:-.015em}.big span{color:var(--mut);font-size:13px}
.big .pg{margin:8px 0 4px}
/* ===== tanlov: karta, liniya ===== */
.lab{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 2px 8px}
.pk{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;margin-top:8px;border:2px solid var(--ln);border-radius:16px;background:var(--sf);cursor:pointer;text-align:left;transition:border-color .2s,background .2s}
.pk[aria-checked=true]{border-color:var(--b2);background:color-mix(in srgb,var(--b2) 10%,var(--sf))}
.pk .sw{width:38px;height:26px;border-radius:7px;flex:none}
.pk b{display:block;font-size:15px}.pk small{color:var(--mut);font-size:12.5px;letter-spacing:.06em}
.pk .ck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--ln);flex:none}
.pk[aria-checked=true] .ck{border-color:var(--b2);box-shadow:inset 0 0 0 4px var(--sf);background:var(--b2)}
.lines{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ln{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 14px;border:2px solid var(--ln);border-radius:14px;background:var(--sf);cursor:pointer;font-weight:700;text-align:left}
.ln i{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.ln[aria-checked=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--sf))}
.tk{display:flex;gap:10px;align-items:flex-start;margin:14px 0 4px;padding:12px 14px;border-radius:14px;background:var(--bg)}
.tk b{display:block}
.prow{display:flex;justify-content:space-between;align-items:center}
.op{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:10px 14px;margin-top:10px;border:1px solid var(--ln);border-radius:16px;background:var(--sf);cursor:pointer;text-align:left;transition:transform .15s,border-color .2s;--a:var(--bl)}
.op:hover{border-color:color-mix(in srgb,var(--a) 55%,var(--ln))}.op:active{transform:scale(.98)}
.op .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--a);color:#fff;flex:none;box-shadow:0 8px 18px color-mix(in srgb,var(--a) 38%,transparent)}
.op .ic svg{width:24px;height:24px}
.op b{display:block;font-size:17px;font-weight:800}.op span{color:var(--mut);font-size:12.5px}
/* ===== tarix, yorliqlar, bo'limlar ===== */
.hi{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}.hi:last-child{border:0}
.hi .bb{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--a,var(--bl));color:#fff;flex:none}.hi .bb svg{width:22px;height:22px}
.hi .g{flex:1;min-width:0}.hi .g b{display:block;font-size:15px;line-height:1.3}
.hi .am{font-weight:800;margin-top:3px}
.tag.mt{background:var(--ln);color:var(--mut)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border-radius:16px;background:var(--sf);border:1px solid var(--ln);margin-top:14px}
.seg button{min-height:48px;border:0;border-radius:12px;background:transparent;cursor:pointer;font-weight:800;font-size:13px;color:var(--mut);transition:background .2s,color .2s;padding:0 4px}
.seg button[aria-selected=true]{background:var(--p);color:var(--on)}
.ab{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}.ab svg{width:22px;height:22px}
.ar{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--ln)}.ar:last-child{border:0}
.ar .g{flex:1;min-width:0}.ar .g b{display:block;font-size:15px}
.qb{background:#fff;border-radius:14px;padding:10px;width:190px;height:190px;margin:14px auto 8px}.qb svg{width:100%;height:100%;display:block}
.art .spin{transform-origin:150px 62px;transform-box:view-box;animation:spin 40s linear infinite}
.art .f1,.art .f2,.art .f3{animation:float 6s ease-in-out infinite}
.art .f2{animation-duration:7.5s;animation-delay:-2s}.art .f3{animation-duration:5s;animation-delay:-1s}
@keyframes float{50%{transform:translateY(-9px)}}
.hi.flash,.ar.flash{animation:hflash 1.4s ease-out}
@keyframes hflash{from{background:color-mix(in srgb,var(--ok) 24%,transparent)}to{background:transparent}}
.sheet .card{animation:sup .32s cubic-bezier(.2,.7,.2,1)}@keyframes sup{from{transform:translateY(46px);opacity:0}}
.btn.s,.btn{text-decoration:none}
a.btn{display:flex;align-items:center;justify-content:center}
.toast{z-index:40}
a.glass{text-decoration:none;color:#fff}
</style></head><body>

<div class="bg" aria-hidden="true">

<script>
/* ===== kirgan talabani tekshirish (ma'lumot talaba/index.html'dan sessionStorage orqali keladi) ===== */
function ses(){try{var u=JSON.parse(sessionStorage.getItem("hemis_talaba"));return u&&u.id&&u.name&&typeof u.s=="number"?u:null}catch(x){return null}}
var U=ses();
if(!U){location.replace("/talaba/")}else{start()}

function start(){
var $=i=>document.getElementById(i);
var MN=["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
/* NAMUNA (demo): bir safar narxi, kontrakt va yotoqxona summalari. Kartalar va balans YO'Q: kartani talaba o'zi qo'shadi */
var FARE=1400,C={total:21000000,date:"1-dekabr, 2026"},Dm={total:2250000,date:"25-oktabr, 2026",room:"2-turarjoy, 214-xona"},KD=["m","b","o","k","y"];
/* sessionStorage hemis_h (talaba ID'siga bog'langan): kartalar (faqat niqoblangan raqam), ATTO, amallar tarixi, arizalar, kontrakt/yotoqxona to'lovlari. Serverga hech narsa ketmaydi */
var H={cards:[],at:null,hist:[],ap:[],ct:14000000,dm:1350000},sn=(v,n)=>typeof v=="string"?v.slice(0,n):"";
try{var o=JSON.parse(sessionStorage.getItem("hemis_h"));if(o&&o.id===U.id){
 if(Array.isArray(o.cards))H.cards=o.cards.slice(0,6).map(c=>c&&({b:sn(c.b,12),m:sn(c.m,19),e:sn(c.e,5),h:sn(c.h,40)})).filter(c=>c&&/^\d{4} •••• •••• \d{4}$/.test(c.m));
 if(o.at&&typeof o.at.m=="string"&&/^•••• \d{4}$/.test(o.at.m))H.at={m:o.at.m};
 if(Array.isArray(o.hist))H.hist=o.hist.slice(0,30).filter(x=>x&&KD.indexOf(x.k)>-1&&typeof x.a=="number"&&typeof x.d=="number").map(x=>({k:x.k,s:sn(x.s,80),a:x.a,c:sn(x.c,40),d:x.d}));
 if(Array.isArray(o.ap))H.ap=o.ap.slice(0,20).filter(a=>a&&["yo","ij","kt"].indexOf(a.k)>-1&&typeof a.d=="number").map(a=>({k:a.k,n:sn(a.n,120),d:a.d}));
 if(typeof o.ct=="number"&&o.ct>=0&&o.ct<=C.total)H.ct=o.ct;
 if(typeof o.dm=="number"&&o.dm>=0&&o.dm<=Dm.total)H.dm=o.dm}}catch(x){}
function saveH(){try{sessionStorage.setItem("hemis_h",JSON.stringify({id:U.id,cards:H.cards,at:H.at,hist:H.hist,ap:H.ap,ct:H.ct,dm:H.dm}))}catch(x){}}

var esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
var pad=n=>(n<10?"0":"")+n,fmt=n=>n.toLocaleString("ru-RU").replace(/\u00a0/g," ")+" so'm",dl=t=>{var d=new Date(t);return `${d.getDate()}-${MN[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`};
var rm=()=>matchMedia("(prefers-reduced-motion:reduce)").matches,dg=s=>s.replace(/\D/g,"");
function toast(m){var t=$("ts");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2800)}
function sp(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")}
function fmtCard(el){el.addEventListener("input",()=>{el.value=dg(el.value).slice(0,16).replace(/(\d{4})(?=\d)/g,"$1 ")})}
function fmtAmt(el){el.addEventListener("input",()=>{el.value=sp(dg(el.value).replace(/^0+/,""))})}

/* ===== kod bilan chizilgan belgilar ===== */
var IC={
 ho:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 ta:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6"/>',
 ja:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 ha:'<path d="M3 8a2 2 0 0 1 2-2h13v3"/><rect x="3" y="8" width="18" height="12" rx="3"/><circle cx="16.5" cy="14" r="1"/>',
 sh:'<circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/>',
 mo:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
 su:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/>',
 lf:'<path d="M15 5l-7 7 7 7"/>',rt:'<path d="M9 5l7 7-7 7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',pl:'<path d="M12 5v14M5 12h14"/>',
 cd:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/>',
 ot:'<path d="M4 8h14l-3-3M20 16H6l3 3"/>',
 bus:'<rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 18v3M16 18v3"/><circle cx="8" cy="14.5" r="1"/><circle cx="16" cy="14.5" r="1"/>',
 mt:'<rect x="5" y="3" width="14" height="14" rx="4"/><path d="M5 10h14M9 17l-2 4M15 17l2 4"/><circle cx="9" cy="13.5" r="1"/><circle cx="15" cy="13.5" r="1"/>',
 ij:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
 kt:'<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>',
 rb:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 ck:'<path d="M5 12l5 5 9-10"/>'
};
var svg=(k,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.9}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

/* ===== kartalar ma'lumoti ===== */
var BR={Uzcard:["#1B365D","#3B6DB0"],Humo:["#0F6B55","#22A06B"],Visa:["#4B3A9A","#7C5CD6"],Mastercard:["#9A5B08","#F59E0B"],Karta:["#334155","#5B8FD0"],ATTO:["#0B4D3E","#1F8A70"]};
var cb=b=>{var c=BR[b]||BR.Karta;return `linear-gradient(135deg,${c[0]},${c[1]})`};
function brand(n){return/^8600/.test(n)?"Uzcard":/^9860/.test(n)?"Humo":/^4/.test(n)?"Visa":/^(5[1-5]|2[2-7])/.test(n)?"Mastercard":"Karta"}
function src(t){var r=H.cards.map(c=>({n:c.b,m:c.m,bg:cb(c.b),l:c.b+" •••• "+c.m.slice(-4)}));if(t&&H.at)r.push({n:"ATTO karta",m:H.at.m,bg:cb("ATTO"),l:"ATTO •••• "+H.at.m.slice(-4)});return r}
function cardV(c,full,i,del,fl){return `<div class="cd${full?" full":""}${fl?" flash":""}" style="background:${cb(c.b)}" aria-label="${esc(c.b)}, ${esc(c.m)}"><div class="nm">${esc(c.b)}<span>Faol</span></div><div><div class="no">${esc(c.m)}</div><div class="cf"><span>${esc(c.h||"")}</span><span>${esc(c.e||"")}</span></div></div>${del?`<button class="rm" data-d="${i}" aria-label="Kartani o'chirish">${svg("rb")}</button>`:""}</div>`}
function attoV(del,fl){return `<div class="cd full${fl?" flash":""}" style="background:${cb("ATTO")}" aria-label="ATTO karta, ${esc(H.at.m)}"><div class="nm">ATTO karta<span>Faol</span></div><div><div class="no">${esc(H.at.m)}</div><div class="cf"><span>Transport kartasi</span><span></span></div></div>${del?`<button class="rm" data-d="a" aria-label="ATTO kartani o'chirish">${svg("rb")}</button>`:""}</div>`}
var HK={m:["mt","#E5484D"],b:["bus","#3B82F6"],o:["ot","#22A06B"],k:["kt","#7C5CD6"],y:["ho","#F59E0B"]};
function addHist(k,s,a,c){H.hist.unshift({k:k,s:s,a:a,c:c,d:Date.now()});H.hist=H.hist.slice(0,30);saveH()}
function hist(kinds,n,fl){var L=H.hist.filter(x=>kinds.indexOf(x.k)>-1).slice(0,n||6);return L.length?L.map((x,i)=>`<div class="hi${fl&&i==0?" flash":""}"><div class="bb" style="--a:${HK[x.k][1]}">${svg(HK[x.k][0])}</div><div class="g"><b>${esc(x.s)}</b><span class="mut">${esc(x.c)} · ${dl(x.d)}</span><div class="am">−${fmt(x.a)}</div></div></div>`).join(""):'<p class="mut" style="padding:14px 0">Hali amal bajarilmagan</p>'}

/* ===== pastdan chiqadigan oyna va tanlov ro'yxatlari ===== */
var shOp=null,qt=null;
function sheet(title,body,opener){shOp=opener||document.activeElement;
 $("sh").innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-labelledby="sht"><div class="hd"><h2 id="sht">${title}</h2><button class="ib" id="sx" aria-label="Yopish">${svg("x")}</button></div>${body}</div>`;
 $("sh").classList.remove("hid");document.body.style.overflow="hidden";$("sx").onclick=shut;$("sh").onclick=e=>{if(e.target===$("sh"))shut()};
 var f=$("sh").querySelector("input,.btn");if(f)f.focus()}
function shut(){clearInterval(qt);$("sh").classList.add("hid");$("sh").innerHTML="";document.body.style.overflow="";if(shOp&&shOp.focus&&document.contains(shOp))shOp.focus()}
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&!$("sh").classList.contains("hid"))shut()});
function radios(id,fn){var g=$(id);g.onclick=e=>{var b=e.target.closest&&e.target.closest("[role=radio]");if(!b)return;[].forEach.call(g.querySelectorAll("[role=radio]"),x=>x.setAttribute("aria-checked",x==b));var er=$("se");if(er)er.textContent="";if(fn)fn(b)}}
function checked(id){var g=$(id),b=g&&g.querySelector('[aria-checked="true"]');return b?+b.dataset.i:-1}
function srcBlock(t,sel,label){var S=src(t);
 return S.length?`<div class="lab">${label||"To'lov kartasi"}</div><div id="rg" role="radiogroup" aria-label="${label||"To'lov kartasi"}">${S.map((s,i)=>`<button type="button" class="pk" role="radio" aria-checked="${i==sel}" data-i="${i}"><span class="sw" style="background:${s.bg}"></span><span><b>${esc(s.n)}</b><small>${esc(s.m)}</small></span><span class="ck"></span></button>`).join("")}</div>`
 :`<div class="tk"><div><b>Karta ulanmagan</b><span class="mut">Buning uchun avval karta qo'shing.</span></div></div><a class="btn" href="/talaba/hamyon/kartalar/#${t?"qoshish":"qoshish"}" style="margin-top:8px">Karta qo'shish</a>`}
function bindSrc(){if($("rg"))radios("rg")}
/* QR (namuna): tasodifiy naqsh, haqiqiy turniketda ishlamaydi */
function qr(id,seed){var s=seed||Math.floor(Math.random()*1e9),r=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff,h="";
 for(var y=0;y<21;y++)for(var x=0;x<21;x++){var f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13),on;
  if(f){var ax=x>13?x-14:x,ay=y>13?y-14:y;on=ax==0||ax==6||ay==0||ay==6||(ax>1&&ax<5&&ay>1&&ay<5)}else on=r()>.5;
  if(on)h+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 $(id).innerHTML=`<svg viewBox="0 0 21 21" fill="#1B365D" shape-rendering="crispEdges" role="img" aria-label="Namuna QR kod">${h}</svg>`}
/* raqam sanab chiqiladi (harakat o'chiq bo'lsa darhol) */
var shown={},rf={};
function count(id,to,suffix,delay){var el=$(id),from=shown[id]||0,put=v=>{el.innerHTML=sp(v)+"<em>so'm</em>";el.setAttribute("aria-label",fmt(to))};
 cancelAnimationFrame(rf[id]);shown[id]=to;if(rm()||from==to){put(to);return}
 var t0=null,dur=from?900:1300;function f(t){if(t0===null)t0=t;var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);put(Math.round(from+(to-from)*e));if(k<1)rf[id]=requestAnimationFrame(f)}
 setTimeout(()=>{rf[id]=requestAnimationFrame(f)},delay||0)}

/* ===== tungi rejim, chiqish, navigatsiya ===== */
function isDark(){var r=document.documentElement;return r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function setIcon(){$("th").innerHTML=svg(isDark()?"su":"mo")}
function theme(){var r=document.documentElement,v=isDark()?"light":"dark";r.dataset.theme=v;try{localStorage.setItem("hemis_theme",v)}catch(x){}setIcon()}
function out(){clearInterval(qt);try{["hemis_talaba","hemis_m","hemis_scn","hemis_ts","hemis_perm","hemis_h"].forEach(k=>sessionStorage.removeItem(k))}catch(x){}location.replace("/talaba/")}
var T=[["Asosiy","/talaba/asosiy/","ho"],["Ta'lim","/talaba/talim/","ta"],["Jadval","/talaba/jadval/","ja"],["Hamyon","/talaba/hamyon/","ha"],["Shaxsiy","/talaba/shaxsiy/","sh"]];
$("nv").innerHTML=T.map((t,i)=>`<a href="${t[1]}"${i==3?' aria-current="page"':""}>${svg(t[2],1.8)}${t[0]}</a>`).join("");
function topbar(title,sub,back){return `<header class="top rise" style="--i:0"><div class="tr">${back?`<a class="ib" href="${back}" aria-label="Orqaga">${svg("lf")}</a>`:""}<div><h1>${title}</h1>${sub}</div></div><div class="tr"><button class="ib" id="th" aria-label="Tungi va kunduzgi rejim"></button><button class="xb" id="ex">Chiqish</button></div></header>`}
function wire(){$("th").onclick=theme;$("ex").onclick=out;setIcon();
 var h=$("hr");if(h&&matchMedia("(hover:hover)").matches&&!rm())h.addEventListener("pointermove",e=>{var r=h.getBoundingClientRect();h.style.setProperty("--mx",((e.clientX-r.left)/r.width*100)+"%");h.style.setProperty("--my",((e.clientY-r.top)/r.height*100)+"%")})}
var ART='<svg class="art" viewBox="0 0 230 154" fill="none" aria-hidden="true"><defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EADFFF"/><stop offset="1" stop-color="#8FB4F0"/></linearGradient></defs><g class="spin"><circle cx="150" cy="62" r="56" stroke="#fff" stroke-opacity=".2" stroke-dasharray="3 7"/></g><circle cx="150" cy="62" r="36" stroke="#fff" stroke-opacity=".16"/><circle cx="150" cy="62" r="76" stroke="#fff" stroke-opacity=".08"/><g class="f1"><g transform="rotate(-8 156 70)"><rect x="122" y="30" width="68" height="78" rx="10" fill="url(#dg)"/><path d="M134 52h44M134 64h44M134 76h26" stroke="#2B2370" stroke-opacity=".4" stroke-width="4" stroke-linecap="round"/><circle cx="176" cy="96" r="12" fill="#22A06B"/><path d="M170 96l4 4 8-9" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="f2"><path d="M196 14l10 10-14 14-10 2 2-10z" fill="#F59E0B"/></g><circle class="f3" cx="104" cy="118" r="6" fill="#fff" fill-opacity=".35"/><circle class="f3" cx="92" cy="32" r="3.500" fill="#fff" fill-opacity=".45"/></svg>';

var AK={yo:["Yotoqxona","ho","#3B82F6","Yotoqxonaga joylashish uchun ariza"],ij:["Ijara","ij","#F59E0B","Ijara shartnomasi uchun ariza"],kt:["Kontrakt","kt","#7C5CD6","Kontrakt shartnomasi uchun ariza"]},tab=0,fl=false;
function sh(k){if(H.ap.some(a=>a.k==k))return{t:"Ariza ko'rib chiqilmoqda",c:"bl"};return k=="ij"?{t:"Mavjud emas",c:"mt"}:{t:"Faol",c:"ok"}}
var SD={yo:()=>`${Dm.room} · ${fmt(Dm.total)}`,ij:()=>"Ijara shartnomasi tuzilmagan",kt:()=>`${fmt(C.total)} · to'lov muddati ${C.date}`};
function p0(){return `<div class="card" style="padding:8px 16px 16px"><p class="mut" style="margin:10px 0 2px">Qaysi turdagi ariza yuborasiz?</p>${Object.keys(AK).map(k=>`<button class="op" data-a="${k}" style="--a:${AK[k][2]}"><div class="ic">${svg(AK[k][1])}</div><div><b>${AK[k][0]}</b><span>${AK[k][3]}</span></div></button>`).join("")}</div>`}
function p1(){return `<div class="card" style="padding:4px 16px">${H.ap.length?H.ap.map((a,i)=>`<div class="ar${fl&&i==0?" flash":""}"><div class="ab" style="background:${AK[a.k][2]}">${svg(AK[a.k][1])}</div><div class="g"><b>${AK[a.k][0]} uchun ariza</b><span class="mut">Yuborilgan: ${dl(a.d)}</span>${a.n?`<div class="mut" style="margin-top:2px">Izoh: ${esc(a.n)}</div>`:""}<div style="margin-top:8px"><span class="tag bl">Ko'rib chiqilmoqda</span></div></div></div>`).join(""):`<div style="padding:16px 0"><b>Hali ariza yuborilmagan</b><p class="mut" style="margin:4px 0 12px">Ariza yuborgach, uning holati shu yerda ko'rinadi.</p><button class="btn" data-t="0">Ariza yuborish</button></div>`}</div>`}
function p2(){return `<div class="card" style="padding:4px 16px">${Object.keys(AK).map(k=>{var s=sh(k);return `<div class="ar"><div class="ab" style="background:${AK[k][2]}">${svg(AK[k][1])}</div><div class="g"><b>${AK[k][0]} shartnomasi</b><span class="mut">${esc(SD[k]())}</span><div style="margin-top:8px"><span class="tag ${s.c}">${s.t}</span></div></div></div>`}).join("")}</div><p class="mut" style="margin:10px 4px 0">Shartnomalar holati namuna (demo): haqiqiy holat server ulangach olinadi.</p>`}
function go(t){tab=t;[0,1,2].forEach(i=>{$("t"+i).setAttribute("aria-selected",i==t)});$("pn").setAttribute("aria-labelledby","t"+t);$("pn").innerHTML=[p0,p1,p2][t]();$("t1").textContent="Arizalar ("+H.ap.length+")";
 var f=H.ap.length+" ta ariza";$("hl").textContent=f;$("sb").textContent=Object.keys(AK).filter(k=>sh(k).c=="ok").length+" ta faol shartnoma (namuna)"}
function apply(k,op){if(H.ap.some(a=>a.k==k)){toast(AK[k][0]+" uchun ariza allaqachon yuborilgan");return}
 sheet(AK[k][0]+" uchun ariza",`<div class="tk"><div><b>${esc(U.name)}</b><span class="mut">ID ${esc(U.id)} · ST-50/24 · 5-semestr</span></div></div>
  <label for="s2">Izoh (ixtiyoriy)</label><input id="s2" maxlength="120" autocomplete="off" placeholder="Qo'shimcha ma'lumot"><button class="btn" style="margin-top:20px" id="go">Ariza yuborish</button><p class="err" id="se" role="alert"></p>
  <p class="mut">Ariza shu brauzer oynasida saqlanadi, server hali yo'q.</p>`,op);
 $("go").onclick=()=>{H.ap.unshift({k:k,n:$("s2").value.trim().slice(0,120),d:Date.now()});saveH();shut();fl=true;go(1);setTimeout(()=>{fl=false},1600);toast("Ariza yuborildi")}}
function render(){
 $("m").innerHTML=`${topbar("Arizalar",`<span class="mut">Ariza va shartnomalar</span>`,"/talaba/hamyon/")}
 <section class="hero g3 rise" style="--i:1" id="hr" aria-label="Arizalar va shartnomalar">${ART}<small>Ariza va shartnomalar</small><span class="hl" id="hl"></span><span class="sb" id="sb"></span></section>
 <div class="seg rise" style="--i:2" id="sg" role="tablist" aria-label="Bo'limlar"><button role="tab" id="t0" aria-controls="pn">Ariza yuborish</button><button role="tab" id="t1" aria-controls="pn">Arizalar</button><button role="tab" id="t2" aria-controls="pn">Shartnomalar</button></div>
 <div class="rise" style="--i:3;margin-top:14px" id="pn" role="tabpanel"></div>
 <p class="note rise" style="--i:4">Yotoqxona, ijara va kontrakt arizalari bir joyda. Yuborilgan ariza holati "Ko'rib chiqilmoqda" bo'lib turadi: holatni o'zgartirish uchun server kerak.</p>`;
 wire();go(tab);
 $("sg").onclick=e=>{var b=e.target.closest&&e.target.closest("[role=tab]");if(b)go(+b.id.slice(1))};
 $("pn").onclick=e=>{var b=e.target.closest&&e.target.closest("[data-a],[data-t]");if(!b)return;if(b.dataset.a)apply(b.dataset.a,b);else go(+b.dataset.t)}}
render();

}
</script></body></html>
